<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Block Blast Click Drop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2f5aa0;font-family:sans-serif;height:100vh;display:flex;flex-direction:column;touch-action:manipulation}
.top{padding:12px;display:flex;justify-content:space-between;background:rgba(0,0,0,.15)}
.top button{padding:8px 14px;border-radius:10px;border:none;font-weight:bold}
.board{margin:10px auto;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#1e3a6b;padding:10px;border-radius:16px;width:92vw;max-width:360px;aspect-ratio:1}
.cell{background:#243d6b;border-radius:6px}
.cell.sel{background:#4a6aa0}
.cell.filled{box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.tray{display:flex;justify-content:space-around;background:#3a7bd5;margin:10px;border-radius:16px;padding:14px}
.box{display:grid;gap:2px;padding:6px;border-radius:8px}
.box.active{outline:3px solid yellow;transform:scale(1.1)}
.box.done{opacity:.2;pointer-events:none}
.b{width:24px;height:24px;border-radius:4px}
.c1{background:#2ab8d8}.c2{background:#ffde59}.c3{background:#ff6b9d}.c4{background:#2ecc71}.c5{background:#ff9f43}
.score{text-align:center;color:white;font-size:50px;font-weight:bold}
.set{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.setbox{background:white;padding:20px;border-radius:16px;width:80%;text-align:center}
</style>
</head>
<body>
<div class="top">
<button onclick="location.href='index.html'">◀ Arena</button>
<button onclick="document.getElementById('set').style.display='flex'">⚙️ SETTINGS</button>
</div>
<div class="score" id="sc">0</div>
<div style="text-align:center;color:white;font-size:12px">🏆 Best <span id="bst">0</span> • <span id="sndStatus">Sound ON - Tap once to enable</span></div>
<div class="board" id="board"></div>
<div class="tray" id="tray"></div>

<div class="set" id="set">
<div class="setbox">
<h3>Settings</h3>
<p style="margin:12px 0"><button onclick="toggleSound()" id="sndBtn" style="padding:10px 20px;border-radius:10px;border:none;background:#2f5aa0;color:white;font-weight:bold">🔊 Sound: ON</button></p>
<p style="font-size:12px;color:#666">Para gumana sound: i-tap muna kahit saan sa game. Naka-block ng phone pag walang tap.</p>
<button onclick="document.getElementById('set').style.display='none'" style="margin-top:10px;padding:8px 16px">Close</button>
</div>
</div>

<script>
let ctx=null; let soundOn=true;
function getCtx(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }
function beep(f,d,v=0.3){ if(!soundOn) return; try{ const c=getCtx(); const o=c.createOscillator(); const g=c.createGain(); o.frequency.value=f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(v,c.currentTime); g.gain.linearRampToValueAtTime(0.01,c.currentTime+d); o.start(); o.stop(c.currentTime+d); }catch(e){} }

let grid=Array(8).fill().map(()=>Array(8).fill(0));
let score=0; let best=localStorage.getItem('bbBest')||0; document.getElementById('bst').innerText=best;
let sel=null, selIdx=null;

const SHAPES=[
 {cells:[[0,0],[1,0],[2,0],[1,1]], col:'c1'},
 {cells:[[0,0],[0,1],[1,0],[1,1]], col:'c2'},
 {cells:[[0,0],[1,0],[2,0],[1,1]], col:'c3'},
 {cells:[[0,0],[1,0],[0,1]], col:'c4'},
 {cells:[[0,0],[1,0],[2,0]], col:'c5'},
];

function drawBoard(){
 const b=document.getElementById('board'); b.innerHTML='';
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const d=document.createElement('div'); d.className='cell'; d.dataset.r=r; d.dataset.c=c;
  if(grid[r][c]){ d.classList.add('filled', grid[r][c]); }
  d.onclick=()=>boardClick(r,c);
  b.appendChild(d);
 }
}
let trayData=[];
function drawTray(){
 const t=document.getElementById('tray'); t.innerHTML=''; trayData=[];
 for(let i=0;i<3;i++){
  const sh=SHAPES[Math.floor(Math.random()*SHAPES.length)];
  trayData.push(sh);
  const box=document.createElement('div'); box.className='box'; box.dataset.i=i;
  sh.cells.forEach(([x,y])=>{ const e=document.createElement('div'); e.className='b '+sh.col; e.style.gridColumn=x+1; e.style.gridRow=y+1; box.appendChild(e); });
  box.onclick=()=>selectBox(i);
  t.appendChild(box);
 }
}

function selectBox(i){
 getCtx(); // unlock sound
 if(trayData[i]===null) return;
 if(selIdx===i){ clearSel(); return; }
 clearSel();
 selIdx=i; sel=trayData[i];
 document.querySelectorAll('.box')[i].classList.add('active');
 beep(600,0.12,0.4);
 document.getElementById('sndStatus').innerText='Selected - now tap board where to drop';
}
function clearSel(){
 document.querySelectorAll('.box').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.cell').forEach(x=>x.classList.remove('sel'));
 sel=null; selIdx=null;
}
function can(r,c,sh){
 for(let [x,y] of sh.cells){ let nr=r+y, nc=c+x; if(nr>=8||nc>=8||grid[nr][nc]) return false; }
 return true;
}
function preview(r,c){
 document.querySelectorAll('.cell').forEach(x=>x.classList.remove('sel'));
 if(!sel) return;
 if(!can(r,c,sel)) return;
 for(let [x,y] of sel.cells){ const el=document.querySelector(`.cell[data-r="${r+y}"][data-c="${c+x}"]`); if(el) el.classList.add('sel'); }
}
function boardClick(r,c){
 getCtx();
 if(!sel){ beep(150,0.2,0.2); document.getElementById('sndStatus').innerText='Select block first!'; return; }
 if(!can(r,c,sel)){ beep(150,0.2,0.2); return; }
 // place
 for(let [x,y] of sel.cells){ grid[r+y][c+x]=sel.col; }
 beep(900,0.15,0.5);
 // clear
 let cleared=0;
 for(let rr=0;rr<8;rr++) if(grid[rr].every(v=>v)) { grid[rr]=Array(8).fill(0); cleared++; }
 for(let cc=0;cc<8;cc++) if(grid.every(row=>row[cc])) { for(let rr=0;rr<8;rr++) grid[rr][cc]=0; cleared++; }
 if(cleared){ beep(1200,0.2,0.5); score+=cleared*100; } else score+=10;
 document.getElementById('sc').innerText=score;
 trayData[selIdx]=null; document.querySelectorAll('.box')[selIdx].classList.add('done'); document.querySelectorAll('.box')[selIdx].classList.remove('active');
 clearSel(); drawBoard();
 if(trayData.every(v=>v===null)) drawTray();
 if(isOver()){ beep(200,0.5,0.3); setTimeout(()=>{ alert('Game Over! Score '+score); if(score>best){best=score; localStorage.setItem('bbBest',best); document.getElementById('bst').innerText=best;} grid=Array(8).fill().map(()=>Array(8).fill(0)); score=0; document.getElementById('sc').innerText=0; drawBoard(); drawTray(); },200); }
}
function isOver(){
 for(let sh of trayData){ if(!sh) continue; for(let r=0;r<8;r++)for(let c=0;c<8;c++) if(can(r,c,sh)) return false; } return true;
}
function toggleSound(){ soundOn=!soundOn; document.getElementById('sndBtn').innerText=soundOn?'🔊 Sound: ON':'🔇 Sound: OFF'; document.getElementById('sndStatus').innerText=soundOn?'Sound ON':'Sound OFF'; if(soundOn){ getCtx(); beep(600,0.12);} }

document.getElementById('board').addEventListener('mouseover', (e)=>{ if(e.target.classList.contains('cell')){ const r=+e.target.dataset.r, c=+e.target.dataset.c; preview(r,c); }});

drawBoard(); drawTray();
document.body.addEventListener('click',()=>{ try{getCtx();}catch(e){} }, {once:true});
</script>
</body>
</html>
