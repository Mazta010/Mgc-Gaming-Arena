<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Block Blast Smooth - Click to Drop</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#2f5aa0;font-family:'Fredoka',sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;user-select:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(0,0,0,.15)}
.arena-btn{background:#1a2d5a;color:white;border:none;padding:8px 16px;border-radius:12px;font-family:'Fredoka';font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.trophy{display:flex;align-items:center;gap:6px;color:white;font-size:20px;font-weight:700}
.pause{width:44px;height:44px;background:white;border-radius:50%;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.score-wrap{text-align:center;padding:10px}
.score-big{font-size:64px;color:white;font-weight:700;line-height:1}
.score-label{background:rgba(0,0,0,.2);color:rgba(255,255,255,.8);font-size:12px;padding:2px 10px;border-radius:20px;display:inline-block}
.board-wrap{flex:1;display:flex;justify-content:center;align-items:center;padding:10px}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#1e3a6b;padding:12px;border-radius:20px;width:92vw;max-width:380px;aspect-ratio:1}
.cell{background:#243d6b;border-radius:8px;aspect-ratio:1;transition:.15s}
.cell.preview{background:#3a5aa0!important}
.cell.filled{box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.cell.pop{animation:pop.2s}
@keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.tray{display:flex;justify-content:space-around;align-items:center;background:#3a7bd5;margin:12px;border-radius:20px;padding:16px;min-height:110px}
.block-group{display:grid;gap:3px;cursor:pointer;transition:.2s;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.block-group.selected{transform:scale(1.15) translateY(-10px);filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.block-group.used{opacity:.15;pointer-events:none}
.b{width:28px;height:28px;border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.cyan{background:#2ab8d8}.yellow{background:#ffde59}.pink{background:#ff6b9d}.green{background:#2ecc71}.orange{background:#ff9f43}.purple{background:#a55eea}
.banner{height:60px;background:white;display:flex;align-items:center;justify-content:center;color:#666;font-size:11px;position:relative}
.banner.x{position:absolute;top:4px;right:8px;background:black;color:white;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pause-menu{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99}
.menu-box{background:white;border-radius:20px;padding:24px;width:80%;max-width:300px;text-align:center}
.menu-btn{width:100%;padding:12px;margin:6px 0;border:none;border-radius:12px;font-family:'Fredoka';font-weight:700;cursor:pointer}
.resume{background:#2f5aa0;color:white}.arena{background:#eee}
</style>
</head>
<body>
<div class="top">
<button class="arena-btn" onclick="location.href='index.html'">◀ Arena</button>
<div class="trophy">🏆 <span id="best">0</span></div>
<button class="pause" onclick="openPause()">⏸️</button>
</div>
<div class="score-wrap"><div class="score-big" id="score">0</div><div class="score-label">SCORE</div></div>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="tray" id="tray"></div>
<div class="banner" id="banner">Advertisement • Chill Banner
<div class="x" onclick="document.getElementById('banner').style.display='none'">X</div>
</div>
<div class="pause-menu" id="pauseMenu">
<div class="menu-box">
<h3 style="margin-bottom:12px;color:#1e3a6b">PAUSED</h3>
<button class="menu-btn resume" onclick="closePause()">▶️ Resume</button>
<button class="menu-btn arena" onclick="location.href='index.html'">⬅️ Back to Arena</button>
<p style="margin-top:12px;font-size:12px;color:#666">🏆 Best: <span id="best2">0</span></p>
</div>
</div>

<script>
// SOUNDS - WebAudio
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function playSound(freq,dur,type='sine',vol=0.3){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+dur);
  o.start(); o.stop(audioCtx.currentTime+dur);
}
const sounds = {
  select: ()=>playSound(500,0.1,'sine',0.4),
  place: ()=>playSound(800,0.15,'sine',0.5),
  clear: ()=>{playSound(600,0.1,'sine',0.4); setTimeout(()=>playSound(900,0.2,'sine',0.5),80)},
  fail: ()=>playSound(200,0.2,'square',0.2),
  gameover: ()=>{playSound(400,0.3,'sawtooth',0.3); setTimeout(()=>playSound(250,0.5,'sawtooth',0.3),150)}
};

const boardEl=document.getElementById('board');
const trayEl=document.getElementById('tray');
const scoreEl=document.getElementById('score');
let grid=Array(8).fill().map(()=>Array(8).fill(0));
let score=0, best=localStorage.getItem('blockBest')||0;
let selectedBlock=null, selectedIndex=null;
document.getElementById('best').innerText=best;
document.getElementById('best2').innerText=best;

const shapes=[
  {cells:[[0,0],[1,0],[2,0],[1,1]], color:'cyan'},
  {cells:[[0,0],[0,1],[1,0],[1,1]], color:'yellow'},
  {cells:[[0,0],[1,0],[2,0],[1,1]], color:'pink'},
  {cells:[[0,0],[1,0],[2,0]], color:'orange'},
  {cells:[[0,0],[0,1],[0,2],[1,1]], color:'purple'},
  {cells:[[0,0],[1,0],[0,1]], color:'green'}
];
let trayBlocks=[];

function createBoard(){
  boardEl.innerHTML='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const cell=document.createElement('div');
    cell.className='cell'; cell.dataset.r=r; cell.dataset.c=c;
    cell.onclick=()=>onBoardClick(r,c);
    cell.onmouseenter=()=>onBoardHover(r,c);
    boardEl.appendChild(cell);
  }
}

function genTray(){
  trayBlocks=[]; trayEl.innerHTML='';
  for(let i=0;i<3;i++){
    const shape=shapes[Math.floor(Math.random()*shapes.length)];
    trayBlocks.push(shape);
    const g=document.createElement('div');
    g.className='block-group'; g.dataset.i=i;
    g.style.gridTemplateColumns=`repeat(3,28px)`;
    shape.cells.forEach(([x,y])=>{
      const b=document.createElement('div'); b.className='b '+shape.color;
      b.style.gridColumn=x+1; b.style.gridRow=y+1; g.appendChild(b);
    });
    g.onclick=()=>selectBlock(i);
    trayEl.appendChild(g);
  }
}

function selectBlock(i){
  if(trayBlocks[i]==null) return;
  // Deselect previous
  document.querySelectorAll('.block-group').forEach(el=>el.classList.remove('selected'));
  if(selectedIndex===i){selectedBlock=null; selectedIndex=null; return;} // click ulit to deselect
  selectedIndex=i; selectedBlock=trayBlocks[i];
  trayEl.children[i].classList.add('selected');
  sounds.select();
  // unlock audio on first click
  if(audioCtx.state==='suspended') audioCtx.resume();
}

function onBoardHover(r,c){
  if(!selectedBlock) return;
  clearPreview();
  if(canPlace(selectedBlock,r,c)) showPreview(selectedBlock,r,c);
}

function onBoardClick(r,c){
  if(!selectedBlock){sounds.fail(); return;}
  if(!canPlace(selectedBlock,r,c)){sounds.fail(); return;}
  placeBlock(selectedBlock,r,c);
  trayBlocks[selectedIndex]=null;
  trayEl.children[selectedIndex].classList.add('used');
  trayEl.children[selectedIndex].classList.remove('selected');
  selectedBlock=null; selectedIndex=null;
  clearPreview();
  sounds.place();
  const cleared=checkClear();
  if(cleared>0){score+=cleared*30; if(cleared>1) score+= (cleared-1)*30; sounds.clear();}
  scoreEl.innerText=score;
  if(trayBlocks.every(b=>b===null)) genTray();
  if(isGameOver()){setTimeout(()=>gameOver(),300)}
}

function canPlace(shape,r,c){
  for(let [x,y] of shape.cells){
    let nr=r+y, nc=c+x;
    if(nr<0||nr>=8||nc<0||nc>=8||grid[nr][nc]!==0) return false;
  }
  return true;
}
function showPreview(shape,r,c){
  for(let [x,y] of shape.cells){
    let el=document.querySelector(`.cell[data-r=\"${r+y}\"][data-c=\"${c+x}\"]`);
    if(el) el.classList.add('preview');
  }
}
function clearPreview(){document.querySelectorAll('.cell.preview').forEach(el=>el.classList.remove('preview'))}
function placeBlock(shape,r,c){
  for(let [x,y] of shape.cells){
    grid[r+y][c+x]=shape.color;
    let el=document.querySelector(`.cell[data-r=\"${r+y}\"][data-c=\"${c+x}\"]`);
    el.className='cell filled '+shape.color; el.classList.add('pop');
  }
}
function checkClear(){
  let clearRows=[], clearCols=[];
  for(let r=0;r<8;r++) if(grid[r].every(v=>v!==0)) clearRows.push(r);
  for(let c=0;c<8;c++) if(grid.every(row=>row[c]!==0)) clearCols.push(c);
  clearRows.forEach(r=>{for(let c=0;c<8;c++){grid[r][c]=0; let el=document.querySelector(`.cell[data-r=\"${r}\"][data-c=\"${c}\"]`); el.className='cell';}});
  clearCols.forEach(c=>{for(let r=0;r<8;r++){grid[r][c]=0; let el=document.querySelector(`.cell[data-r=\"${r}\"][data-c=\"${c}\"]`); el.className='cell';}});
  return clearRows.length+clearCols.length;
}
function isGameOver(){
  for(let block of trayBlocks){ if(!block) continue;
    for(let r=0;r<8;r++)for(let c=0;c<8;c++) if(canPlace(block,r,c)) return false;
  }
  return true;
}
function gameOver(){
  sounds.gameover();
  if(score>best){best=score; localStorage.setItem('blockBest',best); document.getElementById('best').innerText=best;}
  alert('Game Over! Score: '+score+'\\nBest: '+best);
  grid=Array(8).fill().map(()=>Array(8).fill(0));
  score=0; scoreEl.innerText=0; createBoard(); genTray();
}
function openPause(){document.getElementById('pauseMenu').style.display='flex'; document.getElementById('best2').innerText=best;}
function closePause(){document.getElementById('pauseMenu').style.display='none';}

createBoard(); genTray();
</script>
</body>
</html>
