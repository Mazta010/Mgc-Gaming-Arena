<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MGC TETRIS V6.1 SOUNDS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100vw;overflow:hidden;background:#020617}
body{background:radial-gradient(120% at 50% 0%,#1e1b4b,#020617 85%);color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:rgba(0,0,0,.9);height:32px;flex-shrink:0;border-bottom:1px solid rgba(34,211,238,.4);font-size:10px;font-weight:900}
.topbar b{color:#22d3ee}
.tbtn{padding:4px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:9px;font-weight:800;cursor:pointer}
.mbtn{flex:1;padding:5px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-weight:800;font-size:10px}
.mbtn.active{background:#22d3ee;color:#000}
.modeSel{display:flex;gap:5px;margin:4px;width:99%;max-width:500px;flex-shrink:0}
#battle{width:100%;flex:1;display:flex;justify-content:center;align-items:flex-start;padding:2px 4px;overflow:hidden;position:relative}
.boardCard{background:rgba(15,23,42,.98);border:2px solid #22d3ee;border-radius:12px;padding:4px;width:100%;max-width:400px;display:flex;flex-direction:column;position:relative;box-shadow:0 0 20px rgba(34,211,238,.2);height:100%;max-height:calc(100dvh - 32px - 28px - 6px)}
.pName{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;padding:3px 6px;background:rgba(0,0,0,.5);border-radius:6px;margin-bottom:3px;flex-shrink:0}
#nextA{width:44px;height:20px;background:#020617;border-radius:4px}
canvas.mainBoard{width:100%!important;height:auto!important;flex:1;display:block;border-radius:8px;background:#020617;aspect-ratio:10/20;min-height:0;touch-action:none}
#touchOverlay{position:absolute;inset:0;top:26px;z-index:10;display:flex}
.zone{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.zone:active{background:rgba(34,211,238,.12)}
.zoneL{border-right:1px dashed rgba(34,211,238,.15)}
.zoneR{border-left:1px dashed rgba(34,211,238,.15)}
.zoneLabel{position:absolute;bottom:20%;font-size:8px;opacity:0;font-weight:900;letter-spacing:1px;pointer-events:none;transition:opacity.2s;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:10px}
#touchOverlay.showHints.zoneLabel{opacity:.6}
#hintBar{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:3px 10px;border-radius:12px;font-size:8px;letter-spacing:1px;opacity:.7;z-index:20;pointer-events:none;border:1px solid rgba(34,211,238,.3);white-space:nowrap}
.stat{font-size:9px;display:flex;justify-content:space-between;padding:3px 6px;opacity:.8;flex-shrink:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.box{background:#0f172a;border:2px solid #22d3ee;border-radius:16px;padding:16px;width:100%;max-width:360px;text-align:center}
input{width:100%;padding:10px;border-radius:10px;border:2px solid #334155;background:#020617;color:#fff;text-align:center;font-weight:700;margin:5px 0}
button.pri{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(90deg,#22d3ee,#a78bfa);font-weight:900;color:#000;margin-top:6px;cursor:pointer}
#lbModal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:90;padding:12px}
.lbBox{background:#0f172a;border:2px solid #22d3ee;border-radius:14px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;padding:12px}
.logRow{display:grid;grid-template-columns:30px 1fr 60px;gap:6px;padding:6px;font-size:11px}
</style>
</head>
<body>
<div class="topbar"><span>⚔️ <b>MGC</b> V6.1</span><div style="display:flex;gap:5px;align-items:center"><span id="scoreTop">0</span><span style="opacity:.4">|</span><span id="linesTop">L0</span><span style="opacity:.4">|</span><span id="lvTop">Lv1</span><button class="tbtn" id="muteBtn" onclick="toggleMute()">🔊</button><button class="tbtn" onclick="openLB()">🏆</button><button class="tbtn" onclick="location.href='index.html'">⬅️</button></div></div>
<div class="modeSel"><button class="mbtn active" id="btnSolo" onclick="setMode('solo')">🎮 SOLO</button><button class="mbtn" id="btnLocal" onclick="setMode('local')">⚔️ 2P</button><button class="mbtn" id="btnOnline" onclick="setMode('online')">🌐 ONLINE</button></div>
<div id="battle"><div class="boardCard" id="cardA"><div class="pName"><span id="nameA">Mazta</span><div style="display:flex;align-items:center;gap:4px">NEXT<canvas id="nextA"></canvas></div><span id="scoreA">0</span></div><canvas id="boardA" class="mainBoard"></canvas><div id="touchOverlay" class="showHints"><div class="zone zoneL" id="zL"><span class="zoneLabel">◀ LEFT</span></div><div class="zone" id="zC"><span class="zoneLabel">↻ ROTATE</span></div><div class="zone zoneR" id="zR"><span class="zoneLabel">RIGHT ▶</span></div><div id="hintBar">SWIPE DOWN=DROP | LONG=HOLD 🔊</div></div><div class="stat"><span>HOLD:<b id="holdA">-</b></span><span>INVISIBLE TAP</span><span><button class="tbtn" style="padding:2px 6px;font-size:8px" onclick="toggleHints()">HINTS</button></span></div></div></div>
<div id="lbModal" onclick="if(event.target==this) closeLB()"><div class="lbBox"><div style="display:flex;justify-content:space-between"><b>🏆 TOP 100</b><button class="tbtn" onclick="closeLB()">✕</button></div><div id="lbList"></div></div></div>
<div id="startModal" class="modal"><div class="box"><h3>🎮 V6.1 + SOUNDS 🔊</h3><p style="font-size:10px;opacity:.7;margin:6px 0">Invisible + may sounds na!</p><p style="font-size:9px;text-align:left;background:rgba(34,211,238,.1);padding:8px;border-radius:8px;border:1px dashed #22d3ee">👆 LEFT / RIGHT / ROTATE<br>👇 SWIPE DOWN=DROP<br>✋ LONG PRESS=HOLD<br>🔊 May sounds na per move!</p><input id="inA" value="Mazta" maxlength="12"><button class="pri" onclick="startGame()">START 🚀🔊</button></div></div>
<script>
// 🔊 SOUND SYSTEM V6.1
let audioCtx=null, muted=false;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function tone(freq, dur, type='sine', vol=0.3, slide=0){
  try{
    if(muted||!audioCtx) return;
    let o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    if(slide) o.frequency.exponentialRampToValueAtTime(freq+slide, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function playMove(){ tone(320,0.08,'square',0.12); }
function playRotate(){ tone(420,0.12,'sine',0.22,180); }
function playSoft(){ tone(160,0.05,'triangle',0.12); }
function playHard(){ tone(120,0.2,'sawtooth',0.32); tone(70,0.28,'square',0.25); }
function playHold(){ tone(650,0.14,'sine',0.18,-220); }
function playClear(lines){
  let notes=Math.min(lines,4);
  for(let i=0;i<notes;i++) setTimeout(()=>tone(400+i*130,0.22,'sine',0.28), i*85);
  if(lines>=4) setTimeout(()=>{ tone(900,0.45,'square',0.38); tone(1200,0.4,'sine',0.3); }, 340);
}
function playOver(){ tone(220,0.55,'sawtooth',0.35,-90); setTimeout(()=>tone(110,0.7,'sawtooth',0.35),280); }
function toggleMute(){
  muted=!muted;
  document.getElementById('muteBtn').innerText=muted?'🔇':'🔊';
  if(!muted){ initAudio(); tone(440,0.15,'sine',0.25); }
}

const COLS=10,ROWS=20;const SHAPES={I:[[1,1,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],O:[[1,1],[1,1]],S:[[0,1,1],[1,1,0]],T:[[0,1,0],[1,1,1]],Z:[[1,1,0],[0,1,1]]};const COLORS={I:'#22d3ee',J:'#3b82f6',L:'#f97316',O:'#facc15',S:'#22c55e',T:'#a78bfa',Z:'#ef4444'};const KEYS=Object.keys(SHAPES);
let mode='solo',players=[],lastMove=0,lastRot=0,lastHard=0,hints=true;
function toggleHints(){hints=!hints;document.getElementById('touchOverlay').classList.toggle('showHints',hints);}
function openLB(){renderLB();document.getElementById('lbModal').style.display='flex';}function closeLB(){document.getElementById('lbModal').style.display='none';}
function setMode(m){mode=m;document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));let id='btn'+m.charAt(0).toUpperCase()+m.slice(1);let el=document.getElementById(id);if(el)el.classList.add('active');}
function makePlayer(c,nc,name){let ctx=c.getContext('2d'),nctx=nc.getContext('2d'),dpr=window.devicePixelRatio||1;function rs(){let r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.width*2*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);nc.width=60*dpr;nc.height=20*dpr;nctx.setTransform(dpr,0,0,dpr,0,0);}rs();return{canvas:c,ctx,nc,nctx,grid:Array.from({length:ROWS},()=>Array(COLS).fill(0)),cur:null,next:null,hold:null,canHold:true,score:0,lines:0,lv:1,name,over:false,dropT:0,interval:1100,resize:rs}}
function randPiece(){let k=KEYS[Math.floor(Math.random()*KEYS.length)];return{k,shape:SHAPES[k].map(r=>[...r]),x:3,y:0,color:COLORS[k]}}function rotM(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function collide(g,p,dx=0,dy=0,sh=null){let s=sh||p.shape;for(let y=0;y<s.length;y++)for(let x=0;x<s[y].length;x++)if(s[y][x]){let nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&g[ny][nx]))return true}return false}
function lock(p){p.cur.shape.forEach((r,y)=>r.forEach((v,x)=>{if(v){let gy=p.cur.y+y,gx=p.cur.x+x;if(gy>=0)p.grid[gy][gx]=p.cur.color}}));let cl=0;for(let y=ROWS-1;y>=0;y--)if(p.grid[y].every(c=>c)){p.grid.splice(y,1);p.grid.unshift(Array(COLS).fill(0));cl++;y++;}if(cl){p.lines+=cl;p.score+=[0,100,300,600,1000][cl]*p.lv;p.lv=Math.floor(p.lines/10)+1;p.interval=Math.max(280,1100-(p.lv-1)*45);playClear(cl);}spawn(p);p.dropT=0;}
function spawn(p){p.cur=p.next||randPiece();p.next=randPiece();p.canHold=true;if(collide(p.grid,p.cur))p.over=true;}
function drawP(p){let rect=p.canvas.getBoundingClientRect(),sW=rect.width/COLS,ctx=p.ctx;ctx.clearRect(0,0,9999,9999);ctx.strokeStyle='rgba(255,255,255,.06)';for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*sW,0);ctx.lineTo(i*sW,ROWS*sW);ctx.stroke()}for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*sW);ctx.lineTo(COLS*sW,i*sW);ctx.stroke()}p.grid.forEach((row,y)=>row.forEach((c,x)=>{if(c){ctx.fillStyle=c;ctx.fillRect(x*sW+1.2,y*sW+1.2,sW-2.4,sW-2.4);}}));if(p.cur){let gy=p.cur.y;while(!collide(p.grid,p.cur,0,gy-p.cur.y+1))gy++;if(gy!=p.cur.y){ctx.globalAlpha=0.28;p.cur.shape.forEach((r,yy)=>r.forEach((v,xx)=>{if(v)ctx.fillRect((p.cur.x+xx)*sW+1.2,(gy+yy)*sW+1.2,sW-2.4,sW-2.4)}));ctx.globalAlpha=1;}p.cur.shape.forEach((r,yy)=>r.forEach((v,xx)=>{if(v){ctx.fillStyle=p.cur.color;ctx.fillRect((p.cur.x+xx)*sW+1.2,(p.cur.y+yy)*sW+1.2,sW-2.4,sW-2.4);}}));}let nctx=p.nctx,ns=9;nctx.clearRect(0,0,99,99);if(p.next){let sh=p.next.shape,offX=(60-sh[0].length*ns)/2,offY=(20-sh.length*ns)/2;sh.forEach((r,y)=>r.forEach((v,x)=>{if(v){nctx.fillStyle=p.next.color;nctx.fillRect(offX+x*ns,offY+y*ns,ns-1,ns-1);}}));}document.getElementById('holdA').innerText=p.hold?p.hold.k:'-';document.getElementById('scoreA').innerText=p.score;document.getElementById('scoreTop').innerText=p.score;document.getElementById('linesTop').innerText='L'+p.lines;document.getElementById('lvTop').innerText='Lv'+p.lv;}
function loop(){if(!players.length)return;let p=players[0];if(p.over){playOver();let lb=JSON.parse(localStorage.getItem('mgcTetrisLB')||'[]');lb.push({name:p.name,score:p.score,date:new Date().toLocaleDateString()});lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,100);localStorage.setItem('mgcTetrisLB',JSON.stringify(lb));setTimeout(()=>{alert('GAME OVER '+p.score);document.getElementById('startModal').style.display='flex';},400);return;}p.dropT+=16;if(p.dropT>p.interval){if(!collide(p.grid,p.cur,0,1))p.cur.y++;else lock(p);p.dropT=0;}drawP(p);requestAnimationFrame(loop);}
function moveP(d){if(Date.now()-lastMove<100)return;lastMove=Date.now();let p=players[0];if(!p||p.over||!p.cur)return;if(!collide(p.grid,p.cur,d,0)){p.cur.x+=d;playMove();}}
function rotateP(){if(Date.now()-lastRot<180)return;lastRot=Date.now();let p=players[0];if(!p||!p.cur)return;let r=rotM(p.cur.shape);if(!collide(p.grid,p.cur,0,0,r)){p.cur.shape=r;playRotate();}else if(!collide(p.grid,p.cur,-1,0,r)){p.cur.x--;p.cur.shape=r;playRotate();}else if(!collide(p.grid,p.cur,1,0,r)){p.cur.x++;p.cur.shape=r;playRotate();}}
function softP(){let p=players[0];if(!p||p.over)return;if(!collide(p.grid,p.cur,0,1)){p.cur.y++;p.dropT=0;playSoft();}}
function hardP(){if(Date.now()-lastHard<400)return;lastHard=Date.now();let p=players[0];if(!p||p.over)return;let d=0;while(!collide(p.grid,p.cur,0,d+1))d++;p.cur.y+=d;p.score+=d*2;playHard();lock(p);}
function holdP(){let p=players[0];if(!p||!p.canHold)return;if(!p.hold){p.hold=p.cur;spawn(p);}else{let t=p.hold;p.hold=p.cur;p.cur=t;p.cur.x=3;p.cur.y=0;}p.canHold=false;playHold();}
function startGame(){initAudio();let a=document.getElementById('inA').value||'Mazta';let ca=document.getElementById('boardA'),na=document.getElementById('nextA');players=[makePlayer(ca,na,a)];players.forEach(p=>{p.next=randPiece();spawn(p);});document.getElementById('startModal').style.display='none';tone(440,0.1,'sine',0.2);setTimeout(()=>tone(660,0.12,'sine',0.2),100);requestAnimationFrame(loop);}
function renderLB(){let lb=JSON.parse(localStorage.getItem('mgcTetrisLB')||'[]');let h='<div class="logRow" style="font-weight:900;opacity:.5"><span>#</span><span>NAME</span><span>SCORE</span></div>';lb.slice(0,100).forEach((e,i)=>{h+=`<div class="logRow"><span>${i+1}</span><span>${e.name}</span><span>${e.score}</span></div>`});if(!lb.length)h='<div style="opacity:.6;text-align:center;padding:20px">Wala pa score</div>';document.getElementById('lbList').innerHTML=h;}
let tsX=0,tsY=0,tsT=0,longTimer=null;
function handleStart(e){let t=e.touches?e.touches[0]:e;tsX=t.clientX;tsY=t.clientY;tsT=Date.now();clearTimeout(longTimer);longTimer=setTimeout(()=>{holdP();if(navigator.vibrate)navigator.vibrate(50);},600);}
function handleEnd(e){clearTimeout(longTimer);let t=e.changedTouches?e.changedTouches[0]:e;let dx=t.clientX-tsX,dy=t.clientY-tsY,dt=Date.now()-tsT;let board=document.getElementById('boardA').getBoundingClientRect();let relX=t.clientX-board.left;if(dt>600)return;if(Math.abs(dy)>50 && dy>30){if(dy>80)hardP();else{softP();softP();}if(navigator.vibrate)navigator.vibrate(20);return;}if(Math.abs(dx)<15 && Math.abs(dy)<15){let w=board.width;if(relX<w*0.33)moveP(-1);else if(relX>w*0.66)moveP(1);else rotateP();if(navigator.vibrate)navigator.vibrate(15);}}
let overlay=document.getElementById('touchOverlay');overlay.addEventListener('touchstart',e=>{e.preventDefault();initAudio();handleStart(e);},{passive:false});overlay.addEventListener('touchend',e=>{e.preventDefault();handleEnd(e);},{passive:false});overlay.addEventListener('mousedown',e=>{initAudio();tsX=e.clientX;tsY=e.clientY;tsT=Date.now();});overlay.addEventListener('mouseup',handleEnd);
document.addEventListener('keydown',e=>{initAudio();if(e.key=='ArrowLeft')moveP(-1);if(e.key=='ArrowRight')moveP(1);if(e.key=='ArrowUp')rotateP();if(e.key=='ArrowDown')softP();if(e.code=='Space')hardP();if(e.key=='c')holdP();});
setMode('solo');
</script>
</body>
</html>
