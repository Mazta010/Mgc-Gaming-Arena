<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MGC TETRIS V6.3 PAUSE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100vw;overflow:hidden;background:#020617}
body{background:radial-gradient(120% at 50% 0%,#1e1b4b,#020617 85%);color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:rgba(0,0,0,.9);height:32px;flex-shrink:0;border-bottom:1px solid rgba(34,211,238,.4);font-size:10px;font-weight:900}
.tbtn{padding:4px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:9px;font-weight:800;cursor:pointer}
.tbtn.pause{background:rgba(251,191,36,.2);border-color:#fbbf24;color:#fbbf24}
.mbtn{flex:1;padding:5px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-weight:800;font-size:10px}
.mbtn.active{background:#22d3ee;color:#000}
.modeSel{display:flex;gap:5px;margin:4px;width:99%;max-width:500px;flex-shrink:0}
#battle{width:100%;flex:1;display:flex;justify-content:center;align-items:flex-start;padding:2px;gap:4px;overflow:hidden;position:relative}
#battle.solo{max-width:420px;margin:0 auto}
#battle.duo{max-width:100%;display:grid;grid-template-columns:1fr 1fr}
.boardCard{background:rgba(15,23,42,.98);border:2px solid #22d3ee;border-radius:10px;padding:3px;width:100%;display:flex;flex-direction:column;position:relative;height:100%;max-height:calc(100dvh - 32px - 28px - 6px)}
.pName{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:900;padding:2px 5px;background:rgba(0,0,0,.5);border-radius:6px;margin-bottom:2px;flex-shrink:0}
#nextA,#nextB{width:36px;height:16px;background:#020617;border-radius:4px}
canvas.mainBoard{width:100%!important;height:auto!important;flex:1;display:block;border-radius:8px;background:#020617;aspect-ratio:10/20;min-height:0}
.touchOverlay{position:absolute;inset:0;top:20px;z-index:10;display:flex}
.zone{flex:1;display:flex;align-items:center;justify-content:center}
.zone:active{background:rgba(34,211,238,.1)}
.hintBar{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:2px 6px;border-radius:10px;font-size:7px;opacity:.6;pointer-events:none;border:1px solid rgba(34,211,238,.2);white-space:nowrap}
.stat{font-size:8px;display:flex;justify-content:space-between;padding:2px 4px;opacity:.7;flex-shrink:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.box{background:#0f172a;border:2px solid #22d3ee;border-radius:16px;padding:14px;width:100%;max-width:380px;text-align:center;max-height:90vh;overflow-y:auto}
.setRow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px;text-align:left}
.setRow input[type=range]{width:130px}
input[type=text]{width:100%;padding:9px;border-radius:8px;border:2px solid #334155;background:#020617;color:#fff;text-align:center;font-weight:700;margin:4px 0}
button.pri{width:100%;padding:11px;border-radius:10px;border:none;background:linear-gradient(90deg,#22d3ee,#a78bfa);font-weight:900;color:#000;margin-top:6px;cursor:pointer}
button.sec{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;margin-top:5px;font-weight:700;cursor:pointer}
#pauseOverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:80;flex-direction:column}
#pauseOverlay.show{display:flex}
.pbox{background:#0f172a;border:2px solid #fbbf24;border-radius:16px;padding:20px;width:90%;max-width:320px;text-align:center}
#lbModal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:90;padding:10px}
.lbBox{background:#0f172a;border:2px solid #22d3ee;border-radius:14px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;padding:10px}
.logRow{display:grid;grid-template-columns:30px 1fr 60px;gap:6px;padding:5px;font-size:11px}
</style>
</head>
<body>
<div class="topbar"><span>⚔️ <b>MGC</b> V6.3</span><div style="display:flex;gap:4px;align-items:center"><span id="scoreTop">0</span>|<span id="lvTop">Lv1</span><button class="tbtn pause" id="pauseBtn" onclick="togglePause()">⏸️</button><button class="tbtn" id="muteBtn" onclick="toggleMute()">🔊</button><button class="tbtn" onclick="openSettings()">⚙️</button></div></div>
<div class="modeSel"><button class="mbtn active" id="btnSolo" onclick="setMode('solo')">🎮 SOLO</button><button class="mbtn" id="btnLocal" onclick="setMode('local')">⚔️ 2P</button><button class="mbtn" id="btnOnline" onclick="setMode('online')">🌐 ONLINE</button></div>
<div id="battle" class="solo">
  <div class="boardCard" id="cardA"><div class="pName"><span id="nameA">Mazta</span><div style="display:flex;align-items:center;gap:3px">NEXT<canvas id="nextA"></canvas></div><span id="scoreA">0</span></div><canvas id="boardA" class="mainBoard"></canvas><div class="touchOverlay" id="touchA"><div class="zone" data-p="0" data-a="L"></div><div class="zone" data-p="0" data-a="C"></div><div class="zone" data-p="0" data-a="R"></div><div class="hintBar">TAP L/R/C | SWIPE=DROP | LONG=HOLD</div></div><div class="stat"><span>H:<b id="holdA">-</b></span><span id="linesA">L0</span></div></div>
  <div class="boardCard" id="cardB" style="display:none"><div class="pName"><span id="nameB">P2</span><div style="display:flex;align-items:center;gap:3px">NEXT<canvas id="nextB"></canvas></div><span id="scoreB">0</span></div><canvas id="boardB" class="mainBoard"></canvas><div class="touchOverlay" id="touchB"><div class="zone" data-p="1" data-a="L"></div><div class="zone" data-p="1" data-a="C"></div><div class="zone" data-p="1" data-a="R"></div><div class="hintBar">P2 BOARD</div></div><div class="stat"><span>H:<b id="holdB">-</b></span><span id="linesB">L0</span></div></div>
</div>

<div id="pauseOverlay"><div class="pbox"><h2>⏸️ PAUSE</h2><p style="font-size:11px;opacity:.7;margin:8px 0">Punta ka na sa CR boss! 🚽😂<br>Safe game mo!</p><div style="font-size:10px;background:rgba(251,191,36,.1);padding:8px;border-radius:8px;margin:8px 0;border:1px dashed #fbbf24">Score: <b id="pauseScore">0</b><br>Lines: <b id="pauseLines">0</b><br>Level: <b id="pauseLv">1</b></div><button class="pri" onclick="togglePause()">▶️ RESUME - BALIK LARO</button><button class="sec" onclick="quitToMenu()">🏠 QUIT TO MENU</button><button class="sec" onclick="openSettings()">⚙️ SETTINGS</button></div></div>

<div id="settingsModal" class="modal" style="display:none" onclick="if(event.target==this) closeSettings()"><div class="box"><h3>⚙️ SETTINGS</h3><div class="setRow"><label>🔊 Volume</label><input type="range" id="volSlider" min="0" max="100" value="70" oninput="changeVol(this.value)"><span id="volTxt">70%</span></div><div class="setRow"><label>🔇 Mute</label><button class="tbtn" id="muteBtn2" onclick="toggleMute()">🔊 ON</button></div><div class="setRow"><label>💡 Hints</label><button class="tbtn" id="hintBtn" onclick="toggleHints()">HIDE</button></div><div class="setRow"><label>📳 Vibrate</label><select id="vibSel" onchange="saveSettings()"><option value="on">ON</option><option value="off">OFF</option></select></div><button class="pri" onclick="closeSettings()">SAVE ✅</button></div></div>

<div id="lbModal" onclick="if(event.target==this) closeLB()"><div class="lbBox"><div style="display:flex;justify-content:space-between"><b>🏆 TOP 100</b><button class="tbtn" onclick="closeLB()">✕</button></div><div id="lbList"></div></div></div>
<div id="startModal" class="modal"><div class="box"><h3>🎮 V6.3 PAUSE READY!</h3><p style="font-size:9px;opacity:.7">May ihi break na boss! 🚽</p><input type="text" id="inA" value="Mazta" maxlength="12"><input type="text" id="inB" value="Kalaban" maxlength="12" style="display:none"><button class="pri" onclick="startGame()">START 🚀</button></div></div>

<script>
let audioCtx=null, muted=false, volume=0.7, vibration=true, isPaused=false;
function loadSettings(){try{let s=JSON.parse(localStorage.getItem('mgcV6Settings')||'{}');volume=s.volume??0.7;muted=s.muted??false;vibration=s.vibration!=='off';}catch{} let vs=document.getElementById('volSlider');if(vs){vs.value=Math.round(volume*100);document.getElementById('volTxt').innerText=Math.round(volume*100)+'%';}let vb=document.getElementById('vibSel');if(vb)vb.value=vibration?'on':'off';updateMuteUI();}
function saveSettings(){localStorage.setItem('mgcV6Settings',JSON.stringify({volume,muted,vibration:document.getElementById('vibSel').value!=='off'}));vibration=document.getElementById('vibSel').value!=='off';}
function changeVol(v){volume=v/100;document.getElementById('volTxt').innerText=v+'%';saveSettings();initAudio();tone(440,0.08,'sine',volume*0.3);}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function tone(f,d,t='sine',vol=0.3,s=0){try{if(muted||!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(vol*volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);if(s)o.frequency.exponentialRampToValueAtTime(f+s,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d);}catch{}}
function playMove(){tone(320,0.07,'square',0.15);}function playRotate(){tone(420,0.11,'sine',0.22,180);}function playSoft(){tone(160,0.04,'triangle',0.12);}function playHard(){tone(120,0.18,'sawtooth',0.32);}function playHold(){tone(650,0.13,'sine',0.18,-220);}function playPause(){tone(500,0.15,'sine',0.25);setTimeout(()=>tone(350,0.2,'sine',0.25),120);}function playResume(){tone(350,0.12,'sine',0.25);setTimeout(()=>tone(600,0.18,'sine',0.3),100);}function playClear(l){let n=Math.min(l,4);for(let i=0;i<n;i++)setTimeout(()=>tone(400+i*130,0.2,'sine',0.28),i*80);if(l>=4)setTimeout(()=>tone(900,0.4,'square',0.38),320);}function playOver(){tone(220,0.5,'sawtooth',0.35,-90);setTimeout(()=>tone(110,0.6,'sawtooth',0.35),250);}
function toggleMute(){muted=!muted;updateMuteUI();saveSettings();if(!muted){initAudio();tone(440,0.12,'sine',volume*0.3);}}function updateMuteUI(){let b1=document.getElementById('muteBtn'),b2=document.getElementById('muteBtn2');if(b1)b1.innerText=muted?'🔇':'🔊';if(b2)b2.innerText=muted?'🔇 MUTED':'🔊 ON';}
function openSettings(){document.getElementById('settingsModal').style.display='flex';}function closeSettings(){document.getElementById('settingsModal').style.display='none';}
function toggleHints(){let vis=document.getElementById('touchA').style.display!=='none';document.querySelectorAll('.touchOverlay').forEach(el=>el.style.display=vis?'none':'flex');let btn=document.getElementById('hintBtn');if(btn)btn.innerText=vis?'SHOW':'HIDE';}
function togglePause(){
  if(!players.length) return;
  isPaused=!isPaused;
  let ov=document.getElementById('pauseOverlay'),btn=document.getElementById('pauseBtn');
  if(isPaused){
    ov.classList.add('show');btn.innerText='▶️';playPause();
    document.getElementById('pauseScore').innerText=players[0]?.score||0;
    document.getElementById('pauseLines').innerText=players[0]?.lines||0;
    document.getElementById('pauseLv').innerText=players[0]?.lv||1;
  }else{
    ov.classList.remove('show');btn.innerText='⏸️';playResume();requestAnimationFrame(loop);
  }
}
function quitToMenu(){isPaused=false;document.getElementById('pauseOverlay').classList.remove('show');document.getElementById('startModal').style.display='flex';players=[];document.getElementById('pauseBtn').innerText='⏸️';}

const COLS=10,ROWS=20;const SHAPES={I:[[1,1,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],O:[[1,1],[1,1]],S:[[0,1,1],[1,1,0]],T:[[0,1,0],[1,1,1]],Z:[[1,1,0],[0,1,1]]};const COLORS={I:'#22d3ee',J:'#3b82f6',L:'#f97316',O:'#facc15',S:'#22c55e',T:'#a78bfa',Z:'#ef4444'};const KEYS=Object.keys(SHAPES);
let mode='solo',players=[],lastMove=[0,0],lastRot=[0,0],lastHard=[0,0];
function setMode(m){mode=m;document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));let el=document.getElementById('btn'+m.charAt(0).toUpperCase()+m.slice(1));if(el)el.classList.add('active');document.getElementById('inB').style.display=m=='local'?'block':'none';let battle=document.getElementById('battle');if(m=='solo'){battle.className='solo';document.getElementById('cardB').style.display='none';}else{battle.className='duo';document.getElementById('cardB').style.display='flex';}}
function makePlayer(c,nc,name){let ctx=c.getContext('2d'),nctx=nc.getContext('2d'),dpr=window.devicePixelRatio||1;function rs(){let r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.width*2*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);nc.width=36*dpr;nc.height=16*dpr;nctx.setTransform(dpr,0,0,dpr,0,0);}rs();return{canvas:c,ctx,nc,nctx,grid:Array.from({length:ROWS},()=>Array(COLS).fill(0)),cur:null,next:null,hold:null,canHold:true,score:0,lines:0,lv:1,name,over:false,dropT:0,interval:1100}}
function randPiece(){let k=KEYS[Math.floor(Math.random()*KEYS.length)];return{k,shape:SHAPES[k].map(r=>[...r]),x:3,y:0,color:COLORS[k]}}function rotM(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function collide(g,p,dx=0,dy=0,sh=null){let s=sh||p.shape;for(let y=0;y<s.length;y++)for(let x=0;x<s[y].length;x++)if(s[y][x]){let nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&g[ny][nx]))return true}return false}
function lock(p,idx){p.cur.shape.forEach((r,y)=>r.forEach((v,x)=>{if(v){let gy=p.cur.y+y,gx=p.cur.x+x;if(gy>=0)p.grid[gy][gx]=p.cur.color}}));let cl=0;for(let y=ROWS-1;y>=0;y--)if(p.grid[y].every(c=>c)){p.grid.splice(y,1);p.grid.unshift(Array(COLS).fill(0));cl++;y++;}if(cl){p.lines+=cl;p.score+=[0,100,300,600,1000][cl]*p.lv;p.lv=Math.floor(p.lines/10)+1;p.interval=Math.max(280,1100-(p.lv-1)*45);if(idx===0)playClear(cl);}spawn(p);p.dropT=0;}
function spawn(p){p.cur=p.next||randPiece();p.next=randPiece();p.canHold=true;if(collide(p.grid,p.cur))p.over=true;}
function drawP(p){let rect=p.canvas.getBoundingClientRect(),sW=rect.width/COLS,ctx=p.ctx;ctx.clearRect(0,0,9999,9999);ctx.strokeStyle='rgba(255,255,255,.05)';for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*sW,0);ctx.lineTo(i*sW,ROWS*sW);ctx.stroke()}for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*sW);ctx.lineTo(COLS*sW,i*sW);ctx.stroke()}p.grid.forEach((row,y)=>row.forEach((c,x)=>{if(c){ctx.fillStyle=c;ctx.fillRect(x*sW+1,y*sW+1,sW-2,sW-2);}}));if(p.cur){let gy=p.cur.y;while(!collide(p.grid,p.cur,0,gy-p.cur.y+1))gy++;if(gy!=p.cur.y){ctx.globalAlpha=0.25;p.cur.shape.forEach((r,yy)=>r.forEach((v,xx)=>{if(v)ctx.fillRect((p.cur.x+xx)*sW+1,(gy+yy)*sW+1,sW-2,sW-2)}));ctx.globalAlpha=1;}p.cur.shape.forEach((r,yy)=>r.forEach((v,xx)=>{if(v){ctx.fillStyle=p.cur.color;ctx.fillRect((p.cur.x+xx)*sW+1,(p.cur.y+yy)*sW+1,sW-2,sW-2);}}));}let nctx=p.nctx,ns=7;nctx.clearRect(0,0,99,99);if(p.next){let sh=p.next.shape,offX=(36-sh[0].length*ns)/2,offY=(16-sh.length*ns)/2;sh.forEach((r,y)=>r.forEach((v,x)=>{if(v){nctx.fillStyle=p.next.color;nctx.fillRect(offX+x*ns,offY+y*ns,ns-1,ns-1);}}));}}
function loop(){if(!players.length||isPaused)return;players.forEach((p,i)=>{if(p.over)return;p.dropT+=16;if(p.dropT>p.interval){if(!collide(p.grid,p.cur,0,1))p.cur.y++;else lock(p,i);p.dropT=0;}drawP(p);if(i==0){document.getElementById('scoreA').innerText=p.score;document.getElementById('scoreTop').innerText=p.score;document.getElementById('lvTop').innerText='Lv'+p.lv;document.getElementById('holdA').innerText=p.hold?p.hold.k:'-';document.getElementById('linesA').innerText='L'+p.lines;}else{document.getElementById('scoreB').innerText=p.score;document.getElementById('holdB').innerText=p.hold?p.hold.k:'-';document.getElementById('linesB').innerText='L'+p.lines;}});if(players.some(p=>p.over)){let win=players.findIndex(p=>!p.over);if(mode=='solo'||players[0].over)playOver();setTimeout(()=>{if(mode=='local'){alert(win===-1?'DRAW!':(players[win].name+' WINS!'));}else{alert('GAME OVER '+players[0].score);}document.getElementById('startModal').style.display='flex';players=[];},400);return;}requestAnimationFrame(loop);}
function moveP(idx,d){if(isPaused||Date.now()-lastMove[idx]<90)return;lastMove[idx]=Date.now();let p=players[idx];if(!p||p.over||!p.cur)return;if(!collide(p.grid,p.cur,d,0)){p.cur.x+=d;if(idx==0)playMove();}}
function rotateP(idx){if(isPaused||Date.now()-lastRot[idx]<170)return;lastRot[idx]=Date.now();let p=players[idx];if(!p||!p.cur)return;let r=rotM(p.cur.shape);if(!collide(p.grid,p.cur,0,0,r)){p.cur.shape=r;if(idx==0)playRotate();}else if(!collide(p.grid,p.cur,-1,0,r)){p.cur.x--;p.cur.shape=r;if(idx==0)playRotate();}else if(!collide(p.grid,p.cur,1,0,r)){p.cur.x++;p.cur.shape=r;if(idx==0)playRotate();}}
function softP(idx){if(isPaused)return;let p=players[idx];if(!p||p.over)return;if(!collide(p.grid,p.cur,0,1)){p.cur.y++;p.dropT=0;if(idx==0)playSoft();}}
function hardP(idx){if(isPaused||Date.now()-lastHard[idx]<350)return;lastHard[idx]=Date.now();let p=players[idx];if(!p||p.over)return;let d=0;while(!collide(p.grid,p.cur,0,d+1))d++;p.cur.y+=d;p.score+=d*2;if(idx==0)playHard();lock(p,idx);}
function holdP(idx){if(isPaused)return;let p=players[idx];if(!p||!p.canHold)return;if(!p.hold){p.hold=p.cur;spawn(p);}else{let t=p.hold;p.hold=p.cur;p.cur=t;p.cur.x=3;p.cur.y=0;}p.canHold=false;if(idx==0)playHold();}
function startGame(){initAudio();let a=document.getElementById('inA').value||'P1';let b=document.getElementById('inB').value||'P2';document.getElementById('nameA').innerText=a;document.getElementById('nameB').innerText=b;let ca=document.getElementById('boardA'),cb=document.getElementById('boardB'),na=document.getElementById('nextA'),nb=document.getElementById('nextB');if(mode=='solo')players=[makePlayer(ca,na,a)];else players=[makePlayer(ca,na,a),makePlayer(cb,nb,b)];players.forEach(p=>{p.next=randPiece();spawn(p);});document.getElementById('startModal').style.display='none';isPaused=false;document.getElementById('pauseOverlay').classList.remove('show');document.getElementById('pauseBtn').innerText='⏸️';if(!muted){tone(440,0.08,'sine',volume*0.3);setTimeout(()=>tone(660,0.1,'sine',volume*0.3),90);}requestAnimationFrame(loop);}
function renderLB(){let lb=JSON.parse(localStorage.getItem('mgcTetrisLB')||'[]');let h='<div class="logRow" style="font-weight:900;opacity:.5"><span>#</span><span>NAME</span><span>SCORE</span></div>';lb.slice(0,100).forEach((e,i)=>{h+=`<div class="logRow"><span>${i+1}</span><span>${e.name}</span><span>${e.score}</span></div>`});if(!lb.length)h='<div style="opacity:.6;text-align:center;padding:20px">Wala pa score</div>';document.getElementById('lbList').innerHTML=h;}
function setupTouch(id,idx){let ov=document.getElementById(id);if(!ov)return;let tsX=0,tsY=0,tsT=0,lt=null;ov.addEventListener('touchstart',e=>{e.preventDefault();if(isPaused)return;initAudio();let t=e.touches[0];tsX=t.clientX;tsY=t.clientY;tsT=Date.now();clearTimeout(lt);lt=setTimeout(()=>{holdP(idx);if(vibration&&navigator.vibrate)navigator.vibrate(40);},580);},{passive:false});ov.addEventListener('touchend',e=>{e.preventDefault();if(isPaused)return;clearTimeout(lt);let t=e.changedTouches[0];let dx=t.clientX-tsX,dy=t.clientY-tsY,dt=Date.now()-tsT;let rect=ov.getBoundingClientRect();let relX=t.clientX-rect.left;if(dt>600)return;if(Math.abs(dy)>45&&dy>25){if(dy>75)hardP(idx);else{softP(idx);softP(idx);}if(vibration&&navigator.vibrate)navigator.vibrate(15);return;}if(Math.abs(dx)<20&&Math.abs(dy)<20){if(relX<rect.width*0.33)moveP(idx,-1);else if(relX>rect.width*0.66)moveP(idx,1);else rotateP(idx);if(vibration&&navigator.vibrate)navigator.vibrate(10);}}, {passive:false});}
setupTouch('touchA',0);setupTouch('touchB',1);
document.addEventListener('keydown',e=>{
  if(e.code=='KeyP'||e.key=='p'||e.key=='P'||e.code=='Escape'){togglePause();return;}
  if(isPaused)return;initAudio();
  if(e.key=='ArrowLeft')moveP(0,-1);if(e.key=='ArrowRight')moveP(0,1);if(e.key=='ArrowUp')rotateP(0);if(e.key=='ArrowDown')softP(0);if(e.code=='Space')hardP(0);if(e.key=='c')holdP(0);
  if(mode=='local'){if(e.key=='a')moveP(1,-1);if(e.key=='d')moveP(1,1);if(e.key=='w')rotateP(1);if(e.key=='s')softP(1);}
});
loadSettings();setMode('solo');
</script>
