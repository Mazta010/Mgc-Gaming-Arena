<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
<title>MGC TETRIS V3 PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100vw;overflow:hidden;background:#020617}
body{background:radial-gradient(120% at 50% 0%,#1e1b4b,#020617 75%);color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(0,0,0,.8);height:46px;flex-shrink:0;border-bottom:1px solid rgba(34,211,238,.3)}
.logo{background:linear-gradient(90deg,#22d3ee,#f472b6,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;font-size:15px;letter-spacing:2px}
.tbtn{padding:7px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:10px;cursor:pointer}
.mbtn{flex:1;padding:9px;border-radius:14px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-weight:900;font-size:11px}
.mbtn.active{background:#22d3ee;color:#000;border-color:#22d3ee}
.modeSel{display:flex;gap:8px;margin:6px;width:99%;max-width:600px;flex-shrink:0}
#battle{width:100%;flex:1;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding:4px;gap:8px;max-height:calc(100dvh - 46px - 40px - 140px)}
#battle.solo{max-width:440px;margin:0 auto;width:100%}
#battle.duo{max-width:800px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;width:100%}
.boardCard{background:rgba(15,23,42,.98);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:4px;position:relative;display:flex;flex-direction:column;width:100%;overflow:hidden;flex:1}
.boardCard.me{border-color:#22d3ee;box-shadow:0 0 0 1px #22d3ee}
canvas{width:100%!important;height:auto!important;display:block;border-radius:10px;background:#020617;aspect-ratio:10/20;flex:1}
.pName{display:flex;justify-content:space-between;font-weight:900;font-size:13px;padding:4px 6px;flex-shrink:0;background:rgba(0,0,0,.3);border-radius:8px;margin-bottom:3px}
#controlsWrap{width:100%;background:linear-gradient(0deg,#020617 90%,rgba(2,6,23,.9));padding:6px 8px;z-index:50;border-top:1px solid rgba(255,255,255,.1);min-height:110px;display:flex;transition:all.3s}
#controlsWrap.pos-left{justify-content:flex-start}
#controlsWrap.pos-center{justify-content:center}
#controlsWrap.pos-right{justify-content:flex-end}
.ctrls{display:flex;gap:8px}
.ctrlBox{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cbtn{border-radius:11px;border:none;background:#1e293b;color:#fff;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1)}
.cbtn.drop{background:linear-gradient(180deg,#22d3ee,#0891b2);color:#000}
.cbtn.hold{background:linear-gradient(180deg,#a78bfa,#6d28d9)}
.size-small.cbtn{height:38px;font-size:14px;min-width:46px}
.size-medium.cbtn{height:48px;font-size:16px;min-width:56px}
.size-large.cbtn{height:62px;font-size:20px;min-width:70px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px}
.box{background:#0f172a;border:2px solid #22d3ee;border-radius:18px;padding:18px;width:100%;max-width:400px;text-align:center;max-height:90vh;overflow-y:auto}
input,select{width:100%;padding:11px;border-radius:10px;border:2px solid #334155;background:#020617;color:#fff;text-align:center;font-weight:700;margin:6px 0;outline:none}
button.pri{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(90deg,#22d3ee,#a78bfa);font-weight:900;color:#000;margin-top:8px;cursor:pointer}
.setRow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;text-align:left}
.setRow select{width:130px;margin:0}
#lbModal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:150;padding:12px}
.lbBox{background:#0f172a;border:2px solid #22d3ee;border-radius:16px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:14px}
.logRow{display:grid;grid-template-columns:36px 1fr 64px 56px;gap:6px;padding:7px 8px;border-radius:8px;font-size:11px;align-items:center}
@media(min-width:900px){#battle{max-height:calc(100dvh - 46px - 40px - 160px)}#battle.solo{max-width:460px}}
</style>
</head>
<body>
<div class="topbar"><div class="logo">⚔️ MGC TETRIS V3</div><div style="display:flex;gap:5px"><button class="tbtn" onclick="openSettings()">⚙️ SET</button><button class="tbtn" onclick="openLB()">🏆 BOARD</button><button class="tbtn" onclick="location.href='index.html'">⬅️ ARENA</button></div></div>
<div class="modeSel"><button class="mbtn active" id="btnSolo" onclick="setMode('solo')">🎮 SOLO</button><button class="mbtn" id="btnLocal" onclick="setMode('local')">⚔️ 2P</button><button class="mbtn" id="btnOnline" onclick="setMode('online')">🌐 ONLINE</button></div>
<div id="battle" class="solo"><div class="boardCard me" id="cardA"><div class="pName"><span id="nameA">Mazta</span><span id="scoreA">0</span></div><canvas id="boardA"></canvas><div class="stat">L:<span id="linesA">0</span> Lv:<span id="lvA">1</span></div></div><div class="boardCard" id="cardB" style="display:none"><div class="pName"><span id="nameB">P2</span><span id="scoreB">0</span></div><canvas id="boardB"></canvas><div class="stat">L:<span id="linesB">0</span> Lv:<span id="lvB">1</span></div></div></div>
<div id="controlsWrap" class="pos-center size-medium"><div class="ctrls" id="ctrlsContainer"><div class="ctrlBox" id="boxA"><div class="grid3"><button class="cbtn" id="bLeft0">◀</button><button class="cbtn" id="bRot0">↻</button><button class="cbtn" id="bRight0">▶</button><button class="cbtn" id="bDown0">▼</button><button class="cbtn drop" id="bDrop0">DROP</button><button class="cbtn hold" id="bHold0">HOLD</button></div></div><div class="ctrlBox" id="boxB" style="display:none"><div class="grid3"><button class="cbtn" id="bLeft1">◀</button><button class="cbtn" id="bRot1">↻</button><button class="cbtn" id="bRight1">▶</button><button class="cbtn" id="bDown1">▼</button><button class="cbtn drop" id="bDrop1">DROP</button><button class="cbtn hold" id="bHold1">HOLD</button></div></div></div></div>
<div id="lbModal" onclick="if(event.target==this) closeLB()"><div class="lbBox"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>🏆 TOP 100</b><button class="tbtn" onclick="closeLB()">✕ CLOSE</button></div><div id="lbList"></div></div></div>
<div id="settingsModal" class="modal" style="display:none" onclick="if(event.target==this) closeSettings()"><div class="box"><h3>⚙️ CONTROLS SETTINGS</h3><div class="setRow"><label>📍 Position</label><select id="selPos" onchange="saveSettings()"><option value="left">⬅️ Left</option><option value="center" selected>⬇️ Center</option><option value="right">➡️ Right</option></select></div><div class="setRow"><label>📏 Laki</label><select id="selSize" onchange="saveSettings()"><option value="small">Small</option><option value="medium" selected>Medium</option><option value="large">Large</option></select></div><div class="setRow"><label>🎮 Sensitivity</label><select id="selSens" onchange="saveSettings()"><option value="slow">🐢 Slow</option><option value="medium" selected>⚡ Medium</option><option value="fast">🚀 Fast</option></select></div><button class="pri" onclick="closeSettings()">SAVE & PLAY ✅</button></div></div>
<div id="startModal" class="modal"><div class="box"><h2>🎮 MGC TETRIS V3 PRO</h2><input id="inA" placeholder="Your Name" value="Mazta" maxlength="12"><input id="inB" placeholder="Enemy Name" value="Kalaban" maxlength="12" style="display:none"><button class="pri" onclick="startGame()">START GAME 🚀</button><div style="display:flex;gap:6px;margin-top:10px"><button onclick="openSettings()" style="flex:1;padding:9px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #334155;font-size:11px">⚙️ SET</button><button onclick="openLB()" style="flex:1;padding:9px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #334155;font-size:11px">🏆 BOARD</button><button onclick="location.href='index.html'" style="flex:1;padding:9px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #334155;font-size:11px">🏠 ARENA</button></div></div></div>
<script>
const COLS=10,ROWS=20;const SHAPES={I:[[1,1,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],O:[[1,1],[1,1]],S:[[0,1,1],[1,1,0]],T:[[0,1,0],[1,1,1]],Z:[[1,1,0],[0,1,1]]};const COLORS={I:'#22d3ee',J:'#3b82f6',L:'#f97316',O:'#facc15',S:'#22c55e',T:'#a78bfa',Z:'#ef4444'};const KEYS=Object.keys(SHAPES);let mode='solo',players=[],lastMove=0,lastRot=0,lastHard=0,settings={pos:'center',size:'medium',sens:'medium'};
function loadSettings(){try{let s=JSON.parse(localStorage.getItem('mgcTetrisSettings')||'{}');settings={...settings,...s};}catch{}document.getElementById('selPos').value=settings.pos;document.getElementById('selSize').value=settings.size;document.getElementById('selSens').value=settings.sens;applySettings();}
function saveSettings(){settings.pos=document.getElementById('selPos').value;settings.size=document.getElementById('selSize').value;settings.sens=document.getElementById('selSens').value;localStorage.setItem('mgcTetrisSettings',JSON.stringify(settings));applySettings();}
function applySettings(){let w=document.getElementById('controlsWrap');w.className='';w.classList.add('pos-'+settings.pos);w.classList.add('size-'+settings.size);}
function openSettings(){document.getElementById('settingsModal').style.display='flex';}function closeSettings(){document.getElementById('settingsModal').style.display='none';}
function getSensDelay(t){if(settings.sens=='slow')return t=='move'?220:t=='rot'?350:t=='hard'?700:0;if(settings.sens=='fast')return t=='move'?80:t=='rot'?150:t=='hard'?350:0;return t=='move'?140:t=='rot'?250:t=='hard'?500:0;}
function openLB(){renderLB();document.getElementById('lbModal').style.display='flex';}function closeLB(){document.getElementById('lbModal').style.display='none';}
function setMode(m){mode=m;document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));document.getElementById('btn'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');document.getElementById('inB').style.display=m=='local'?'block':'none';let b=document.getElementById('battle');if(m=='solo'){b.className='solo';document.getElementById('cardB').style.display='none';document.getElementById('boxB').style.display='none';}else{b.className='duo';document.getElementById('cardB').style.display='flex';document.getElementById('boxB').style.display='block';}}
function makePlayer(c,n){let x=c.getContext('2d'),d=window.devicePixelRatio||1;function r(){let e=c.getBoundingClientRect();c.width=e.width*d;c.height=e.width*2*d;x.setTransform(d,0,0,d,0,0);}r();return{canvas:c,ctx:x,grid:Array.from({length:ROWS},()=>Array(COLS).fill(0)),cur:null,next:null,hold:null,canHold:true,score:0,lines:0,lv:1,name:n,over:false,dropT:0,interval:1100,resize:r}}
function randPiece(){let k=KEYS[Math.floor(Math.random()*KEYS.length)];return{k,shape:SHAPES[k].map(r=>[...r]),x:3,y:0,color:COLORS[k]}}function rotM(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function collide(g,p,dx=0,dy=0,sh=null){let s=sh||p.shape;for(let y=0;y<s.length;y++)for(let x=0;x<s[y].length;x++)if(s[y][x]){let nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&g[ny][nx]))return true}return false}
function lock(p,oi){p.cur.shape.forEach((r,y)=>r.forEach((v,x)=>{if(v){let gy=p.cur.y+y,gx=p.cur.x+x;if(gy>=0)p.grid[gy][gx]=p.cur.color}}));let cl=0;for(let y=ROWS-1;y>=0;y--)if(p.grid[y].every(c=>c)){p.grid.splice(y,1);p.grid.unshift(Array(COLS).fill(0));cl++;y++;}if(cl){p.lines+=cl;p.score+=[0,100,300,600,1000][cl]*p.lv;p.lv=Math.floor(p.lines/10)+1;p.interval=Math.max(300,1100-(p.lv-1)*40);}spawn(p);p.dropT=0;}
function spawn(p){p.cur=p.next||randPiece();p.next=randPiece();p.canHold=true;if(collide(p.grid,p.cur))p.over=true;}
function drawP(p){let rect=p.canvas.getBoundingClientRect(),sW=rect.width/COLS,ctx=p.ctx;ctx.clearRect(0,0,9999,9999);ctx.strokeStyle='rgba(255,255,255,.05)';for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*sW,0);ctx.lineTo(i*sW,ROWS*sW);ctx.stroke()}for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*sW);ctx.lineTo(COLS*sW,i*sW);ctx.stroke()}p.grid.forEach((row,y)=>row.forEach((c,x)=>{if(c){ctx.fillStyle=c;ctx.fillRect(x*sW+1.5,y*sW+1.5,sW-3,sW-3);}}));if(p.cur){let gy=p.cur.y;while(!collide(p.grid,p.cur,0,gy-p.cur.y+1))gy++;if(gy!=p.cur.y){ctx.globalAlpha=0.25;p.cur.shape.forEach((r,yy)=>r.forEach((v,xx)=>{if(v)ctx.fillRect((p.cur.x+xx)*sW+1.5,(gy+yy)*sW+1.5,sW-3,sW-3)}));ctx.globalAlpha=1;}p.cur.shape.forEach((r,yy)=>r.forEach((v,xx)=>{if(v){ctx.fillStyle=p.cur.color;ctx.fillRect((p.cur.x+xx)*sW+1.5,(p.cur.y+yy)*sW+1.5,sW-3,sW-3);}}));}}
function loop(){if(!players.length)return;players.forEach((p,i)=>{if(p.over)return;p.dropT+=16;if(p.dropT>p.interval){if(!collide(p.grid,p.cur,0,1))p.cur.y++;else lock(p,i==0?1:0);p.dropT=0;}drawP(p);document.getElementById(i==0?'scoreA':'scoreB').innerText=p.score;document.getElementById(i==0?'linesA':'linesB').innerText=p.lines;document.getElementById(i==0?'lvA':'lvB').innerText=p.lv;});if(players.some(p=>p.over)){let lb=JSON.parse(localStorage.getItem('mgcTetrisLB')||'[]');lb.push({name:players[0].name,score:players[0].score,date:new Date().toLocaleDateString()});lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,100);localStorage.setItem('mgcTetrisLB',JSON.stringify(lb));alert('GAME OVER! '+players[0].score);document.getElementById('startModal').style.display='flex';return;}requestAnimationFrame(loop);}
function moveP(i,d){let de=getSensDelay('move');if(Date.now()-lastMove<de)return;lastMove=Date.now();let p=players[i];if(!p||p.over||!p.cur)return;if(!collide(p.grid,p.cur,d,0))p.cur.x+=d;}
function rotateP(i){let de=getSensDelay('rot');if(Date.now()-lastRot<de)return;lastRot=Date.now();let p=players[i];if(!p||!p.cur)return;let r=rotM(p.cur.shape);if(!collide(p.grid,p.cur,0,0,r))p.cur.shape=r;else if(!collide(p.grid,p.cur,-1,0,r)){p.cur.x--;p.cur.shape=r;}else if(!collide(p.grid,p.cur,1,0,r)){p.cur.x++;p.cur.shape=r;}}
function softP(i){let p=players[i];if(!p||p.over)return;if(!collide(p.grid,p.cur,0,1)){p.cur.y++;p.dropT=0;}}
function hardP(i){let de=getSensDelay('hard');if(Date.now()-lastHard<de)return;lastHard=Date.now();let p=players[i];if(!p||p.over)return;let d=0;while(!collide(p.grid,p.cur,0,d+1))d++;p.cur.y+=d;p.score+=d*2;lock(p,i==0?1:0);}
function holdP(i){let p=players[i];if(!p||!p.canHold)return;if(!p.hold){p.hold=p.cur;spawn(p);}else{let t=p.hold;p.hold=p.cur;p.cur=t;p.cur.x=3;p.cur.y=0;}p.canHold=false;}
function startGame(){let a=document.getElementById('inA').value||'Mazta';document.getElementById('nameA').innerText=a;let ca=document.getElementById('boardA'),cb=document.getElementById('boardB');if(mode=='solo')players=[makePlayer(ca,a)];else players=[makePlayer(ca,a),makePlayer(cb,document.getElementById('inB').value||'P2')];players.forEach(p=>{p.next=randPiece();spawn(p);});document.getElementById('startModal').style.display='none';requestAnimationFrame(loop);}
function renderLB(){let lb=JSON.parse(localStorage.getItem('mgcTetrisLB')||'[]');let h='<div class="logRow" style="font-weight:900;opacity:.5"><span>#</span><span>NAME</span><span>SCORE</span><span>DATE</span></div>';lb.slice(0,100).forEach((e,i)=>{h+=`<div class="logRow"><span>${i+1}</span><span>${e.name}</span><span>${e.score}</span><span style="font-size:9px">${e.date}</span></div>`});if(!lb.length)h='<div style="opacity:.6;text-align:center;padding:30px">Wala pa score boss!</div>';document.getElementById('lbList').innerHTML=h;}
function bindBtn(id,fn){let el=document.getElementById(id);if(!el)return;let h=(e)=>{e.preventDefault();fn();};el.addEventListener('touchstart',h,{passive:false});el.addEventListener('mousedown',h);}
bindBtn('bLeft0',()=>moveP(0,-1));bindBtn('bRight0',()=>moveP(0,1));bindBtn('bRot0',()=>rotateP(0));bindBtn('bDown0',()=>softP(0));bindBtn('bDrop0',()=>hardP(0));bindBtn('bHold0',()=>holdP(0));
bindBtn('bLeft1',()=>moveP(1,-1));bindBtn('bRight1',()=>moveP(1,1));bindBtn('bRot1',()=>rotateP(1));bindBtn('bDown1',()=>softP(1));bindBtn('bDrop1',()=>hardP(1));bindBtn('bHold1',()=>holdP(1));
loadSettings();setMode('solo');
</script>
</body>
</html>
