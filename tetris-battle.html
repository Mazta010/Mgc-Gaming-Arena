<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tetris Battle - MGC Gaming Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;padding-bottom:70px}
.top-bar{background:#1e293b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #a78bfa}
.top-bar a{color:#a78bfa;text-decoration:none;font-weight:900;font-size:13px}
.stats{display:flex;gap:16px}.stat{font-size:11px;opacity:0.7}.stat b{display:block;font-size:18px;color:#a78bfa;opacity:1}
.game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:10px}
#tetris{background:#1e293b;border:3px solid #334155;border-radius:8px}
.controls{display:flex;gap:8px;justify-content:center}.ctrl{background:#1e293b;border:1px solid #334155;color:#fff;width:54px;height:48px;border-radius:10px;font-size:20px;font-weight:900}
#gameOver{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:10000;flex-direction:column;gap:14px;text-align:center;padding:20px}
#gameOver.show{display:flex}.btn{background:#a78bfa;color:#000;border:none;padding:14px 32px;border-radius:30px;font-weight:900;font-size:15px;cursor:pointer;width:260px}.btn.sec{background:#334155;color:#fff}
#mgcBanner{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:2px solid #a78bfa;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9999}
.mgc-left{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer}.mgc-text{font-size:12px;line-height:1.2}.mgc-text b{color:#a78bfa}
.mgc-btn{background:#a78bfa;color:#000;padding:7px 16px;border-radius:20px;font-size:11px;font-weight:900;border:none;cursor:pointer}.mgc-x{background:none;border:none;color:#fff;font-size:20px;opacity:0.6;cursor:pointer;margin-left:10px}
</style>
</head>
<body>
<div class="top-bar"><a href="index.html">← ARENA</a><div class="stats"><div class="stat">SCORE<b id="score">0</b></div><div class="stat">LINES<b id="lines">0</b></div><div class="stat">BEST<b id="best">0</b></div></div></div>
<div class="game-wrap"><canvas id="tetris" width="240" height="400"></canvas><div class="controls"><button class="ctrl" onclick="playerMove(-1)">◀</button><button class="ctrl" onclick="playerRotate()">↻</button><button class="ctrl" onclick="playerMove(1)">▶</button><button class="ctrl" onclick="playerDrop()">▼</button></div></div>
<div id="gameOver"><h2 style="font-size:32px;color:#a78bfa">GAME OVER!</h2><p>Score: <b id="finalScore">0</b> | Lines: <b id="finalLines">0</b></p><button class="btn" onclick="continueGame()">▶ CONTINUE - Watch Ad</button><button class="btn sec" onclick="restartGame()">🔄 RESTART</button><a href="index.html" style="color:#94a3b8;font-size:13px;text-decoration:none">Back to Arena</a><p style="font-size:11px;opacity:0.5;max-width:260px">CONTINUE removes 4 lines! 1x per game.</p></div>
<div id="mgcBanner"><div class="mgc-left" onclick="openAd()"><div style="font-size:20px">🟪</div><div class="mgc-text"><b>Tetris Battle</b><br>Support free games!</div></div><button class="mgc-btn" onclick="openAd()">SUPPORT</button><button class="mgc-x" onclick="document.getElementById('mgcBanner').style.display='none'">✕</button></div>
<script>
const DIRECT_LINK="https://omg10.com/4/11879270";function openAd(){window.open(DIRECT_LINK,'_blank');}
const canvas=document.getElementById('tetris'),ctx=canvas.getContext('2d');ctx.scale(20,20);const colors=[null,'#a78bfa','#22d3ee','#facc15','#fb7185','#4ade80','#60a5fa','#f472b6'];const pieces={'T':[[0,1,0],[1,1,1]],'O':[[1,1],[1,1]],'L':[[0,0,1],[1,1,1]],'J':[[1,0,0],[1,1,1]],'I':[[1,1,1,1]],'S':[[0,1,1],[1,1,0]],'Z':[[1,1,0],[0,1,1]]};function createMatrix(w,h){const m=[];while(h--){m.push(new Array(w).fill(0))}return m}function createPiece(type){return pieces[type].map(r=>[...r])}let arena=createMatrix(12,20);let player={pos:{x:0,y:0},matrix:null,score:0,lines:0};let best=localStorage.getItem('tetris_best')||0;document.getElementById('best').textContent=best;let dropCounter=0,dropInterval=800,lastTime=0,gameOverFlag=false,canContinue=true;function arenaSweep(){let rowCount=0;outer:for(let y=arena.length-1;y>=0;--y){for(let x=0;x<arena[y].length;++x) if(arena[y][x]===0) continue outer;const row=arena.splice(y,1)[0].fill(0);arena.unshift(row);++y;rowCount++;}if(rowCount){player.score+=rowCount*100;player.lines+=rowCount;document.getElementById('score').textContent=player.score;document.getElementById('lines').textContent=player.lines;dropInterval=Math.max(100,800-player.lines*20);}}function collide(arena,player){const [m,o]=[player.matrix,player.pos];for(let y=0;y<m.length;++y) for(let x=0;x<m[y].length;++x) if(m[y][x]!==0){if(!arena[y+o.y] || arena[y+o.y][x+o.x]!==0) return true;}return false;}function merge(arena,player){player.matrix.forEach((row,y)=>{row.forEach((v,x)=>{if(v!==0) arena[y+player.pos.y][x+player.pos.x]=v;});});}function playerDrop(){player.pos.y++;if(collide(arena,player)){player.pos.y--;merge(arena,player);playerReset();arenaSweep();if(gameOverFlag) return;}dropCounter=0;}function playerMove(dir){player.pos.x+=dir;if(collide(arena,player)) player.pos.x-=dir;}function playerRotate(){const pos=player.pos.x;let offset=1;rotate(player.matrix);while(collide(arena,player)){player.pos.x+=offset;offset=-(offset+(offset>0?1:-1));if(offset>player.matrix[0].length){rotate(player.matrix,-1);player.pos.x=pos;return;}}}function rotate(matrix,dir=1){for(let y=0;y<matrix.length;++y) for(let x=0;x<y;++x) [matrix[x][y],matrix[y][x]]=[matrix[y][x],matrix[x][y]];if(dir>0) matrix.forEach(r=>r.reverse());else matrix.reverse();}function playerReset(){const types=Object.keys(pieces);player.matrix=createPiece(types[Math.floor(Math.random()*types.length)]);player.matrix=player.matrix.map(row=>row.map(v=>v? Math.floor(Math.random()*6)+1:0));player.pos.y=0;player.pos.x=(arena[0].length/2|0)-(player.matrix[0].length/2|0);if(collide(arena,player)){gameOverFlag=true;document.getElementById('finalScore').textContent=player.score;document.getElementById('finalLines').textContent=player.lines;document.getElementById('gameOver').classList.add('show');if(player.score>best){best=player.score;localStorage.setItem('tetris_best',best);document.getElementById('best').textContent=best;}}}function draw(){ctx.fillStyle='#0f172a';ctx.fillRect(0,0,canvas.width,canvas.height);drawMatrix(arena,{x:0,y:0});drawMatrix(player.matrix,player.pos);}function drawMatrix(matrix,offset){matrix.forEach((row,y)=>{row.forEach((v,x)=>{if(v!==0){ctx.fillStyle=colors[v]||'#fff';ctx.fillRect(x+offset.x,y+offset.y,1,1);}});});}function update(time=0){if(gameOverFlag) return;const delta=time-lastTime;lastTime=time;dropCounter+=delta;if(dropCounter>dropInterval) playerDrop();draw();requestAnimationFrame(update);}function continueGame(){if(!canContinue){restartGame();return;}openAd();arena.splice(-4,4);for(let i=0;i<4;i++) arena.unshift(new Array(12).fill(0));document.getElementById('gameOver').classList.remove('show');gameOverFlag=false;canContinue=false;update();}function restartGame(){arena=createMatrix(12,20);player.score=0;player.lines=0;document.getElementById('score').textContent=0;document.getElementById('lines').textContent=0;document.getElementById('gameOver').classList.remove('show');gameOverFlag=false;canContinue=true;dropInterval=800;playerReset();update();}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft') playerMove(-1);else if(e.key==='ArrowRight') playerMove(1);else if(e.key==='ArrowDown') playerDrop();else if(e.key==='ArrowUp') playerRotate();});playerReset();update();
</script>
</body>
</html>
