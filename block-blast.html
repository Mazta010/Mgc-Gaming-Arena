<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MGC BAR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
body{background:#2a437c;color:#fff;font-family:Arial;text-align:center}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#1a2a5a;font-weight:900;font-size:13px}
#trophy{cursor:pointer;background:#16264a;padding:7px 14px;border-radius:20px;border:2px solid #ffeb3b}
#grid{width:96%;max-width:360px;height:520px;margin:8px auto;background:#16264a;border:4px solid #0e1a33;border-radius:12px;position:relative;overflow:hidden}
.bar{position:absolute;height:44px;border-radius:8px;cursor:grab;border:2px solid rgba(0,0,0,.25);transition:top .18s,left .1s}
.c1{background:linear-gradient(180deg,#7ee8fa,#0ebfd3)}.c2{background:linear-gradient(180deg,#8ea8ff,#4b62e0)}.c3{background:linear-gradient(180deg,#ffe07a,#d69e00)}.c4{background:linear-gradient(180deg,#6ee7b7,#059669)}.c5{background:linear-gradient(180deg,#f9a8d4,#db2777)}.c6{background:linear-gradient(180deg,#fdba74,#ea580c)}.c7{background:linear-gradient(180deg,#c4b5fd,#7c3aed)}
#controls{display:flex;justify-content:center;gap:8px;padding:10px}
#controls button{background:#22d3ee;color:#000;border:none;padding:12px 18px;border-radius:22px;font-weight:900;cursor:pointer}
#ad{width:100%;height:70px;border:none;position:fixed;bottom:0;left:0;background:#0f1c3a}
body{padding-bottom:75px}
</style>
<script>
window._allowOpen=false;
window.open=function(){ if(!window._allowOpen) return null; return window.open.apply(this,arguments); };
</script>
</head>
<body>
<div id="top">
<div id="trophy" onclick="showLB()">🏆 <span id="best">0</span></div>
<div id="profile" onclick="showProfile()">👤 <span id="pName">Mazta</span></div>
<div id="moves">Moves:0</div>
<div onclick="togglePause()">⏸️</div>
</div>
<div style="font-size:54px;font-weight:900" id="score">0</div>
<div id="grid"></div>
<div id="controls">
<button onclick="start()">🔄 NEW</button>
<button onclick="toggleSound()" id="sndBtn">🔊 ON</button>
<button onclick="togglePause()" id="pauseBtn">⏸️ PAUSE</button>
<button onclick="location.href='index.html'" style="background:#334155;color:#fff">⬅️ ARENA</button>
</div>
<iframe id="ad" srcdoc="<body style='margin:0;background:#0f1c3a;display:flex;align-items:center;justify-content:center;color:#ffeb3b;font-size:11px'><div>Monetag 286000 Banner<script src=https://quge5.com/88/tag.min.js data-zone=286000></script></div></body>"></iframe>

</body>
</html>
