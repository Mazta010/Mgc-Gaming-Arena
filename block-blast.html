<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Block Blast AUTO RISING + Leaderboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#1e3a8a;min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#fff;padding-bottom:20px}
.top{width:100%;background:#0f172a;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:900;font-size:12px;border-bottom:2px solid #22d3ee;position:sticky;top:0;z-index:99}
.top a{background:#020617;border:2px solid #22d3ee;color:#22d3ee;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:12px}
.score{font-size:56px;font-weight:900;margin:6px 0 0;line-height:1}
.sub{color:#facc15;font-weight:800;font-size:10px;text-align:center}
#board{width:92vw;max-width:380px;aspect-ratio:1;background:#0f172a;border-radius:16px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:5px;padding:10px;margin-top:10px;border:3px solid #1e293b}
.cell{background:#1e293b;border-radius:7px;cursor:pointer;transition:.15s}
.cell.f{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 8px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2)}
.cell.sel{outline:3px solid #22d3ee;box-shadow:0 0 15px #22d3ee;transform:scale(1.12);z-index:2}
#hint{font-size:11px;color:#22d3ee;font-weight:800;margin:8px;text-align:center;min-height:14px}
.ctrls{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:900;font-size:11px;cursor:pointer}
#lb{width:94%;max-width:380px;background:#0f172a;border-radius:16px;padding:14px;margin-top:12px;border:2px solid #334155}
.lbTitle{font-weight:900;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#22d3ee}
.lbRow{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#020617;border-radius:10px;margin-bottom:6px;font-size:12px;font-weight:800}
.lbRow.top1{border:2px solid #facc15;background:#1a1400}
.lbRow.top2{border:1px solid #94a3b8}
.lbRow.top3{border:1px solid #fb923c}
</style>
</head>
<body>
<div class="top"><a href="index.html">← ARENA</a><span>🏆 Best:<span id="best">0</span></span><span>Auto ⬆️ <span id="tm">0</span>s</span><span id="mv">Score:0</span></div>
<div class="score" id="big">0</div>
<div class="sub">AUTO RISING 1,2,3,4 BLOCKS! TAP BLOCK → TAP EMPTY PARA MAPUNO LINE!</div>
<div id="board"></div>
<div id="hint">Auto aakyat every 2 sec! I-move mo para mabuo line!</div>
<div class="ctrls">
<button class="btn" style="background:#e2e8f0;color:#000" onclick="toggleAuto()" id="autoBtn">⏸️ PAUSE</button>
<button class="btn" style="background:#facc15;color:#000" onclick="newGame()">🔄 NEW GAME</button>
<a href="index.html" class="btn" style="background:#0f172a;border:2px solid #22d3ee;color:#22d3ee;text-decoration:none">🏠 ARENA</a>
</div>

<div id="lb">
<div class="lbTitle"><span>🏆 LEADERBOARD - TOP 10</span><span style="font-size:10px;opacity:.7" id="lbCount">0 players</span></div>
<div id="lbList"></div>
<div style="margin-top:10px;display:flex;gap:8px">
<input id="pname" placeholder="Name mo (Mazta)" style="flex:1;padding:10px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;font-weight:800;font-size:12px" maxlength="12">
<button onclick="saveScore()" style="padding:10px 16px;border-radius:10px;border:none;background:#22d3ee;color:#000;font-weight:900;font-size:12px">SAVE SCORE</button>
</div>
</div>

<script>
const COLS=8,ROWS=8,COLORS=["#f472b6","#60a5fa","#34d399","#facc15","#fb923c","#a78bfa","#22d3ee","#f87171"];
let board,score=0,best=0,sel=null,auto=true,timer=0,interval;
let lb=JSON.parse(localStorage.getItem("bbLB")||"[]");
best=parseInt(localStorage.getItem("bbBest")||0);

function newGame(){
 board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
 score=0; sel=null; timer=0;
 for(let y=ROWS-3;y<ROWS;y++) for(let x=0;x<COLS;x++) if(Math.random()<0.35) board[y][x]=COLORS[Math.floor(Math.random()*COLORS.length)];
 draw(); upd(); renderLB(); startAuto();
 document.getElementById("hint").innerText="Auto aakyat! I-move blocks para mapuno line!";
}
function startAuto(){
 clearInterval(interval);
 interval=setInterval(()=>{
   if(!auto) return;
   timer++; document.getElementById("tm").innerText=timer;
   if(timer%2==0) rise();
 },1000);
}
function rise(){
 for(let y=0;y<ROWS-1;y++) board[y]=[...board[y+1]];
 let newRow=Array(COLS).fill(0);
 let x=0;
 while(x<COLS){
   if(Math.random()<0.55){
     let w=[1,2,3,4][Math.floor(Math.random()*4)];
     if(x+w>COLS) w=COLS-x;
     let col=COLORS[Math.floor(Math.random()*COLORS.length)];
     for(let i=0;i<w;i++) newRow[x+i]=col;
     x+=w+(Math.random()<0.5?1:0);
   } else x++;
 }
 board[ROWS-1]=newRow;
 checkClear();
 draw(); upd();
 if(board[0].some(c=>c)){ clearInterval(interval); setTimeout(()=>{ gameOver(); },300); }
}
function draw(){
 let b=document.getElementById("board"); b.innerHTML="";
 for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
   let c=document.createElement("div"); c.className="cell"+(board[y][x]?" f":"")+(sel&&sel.x==x&&sel.y==y?" sel":"");
   if(board[y][x]) c.style.background=board[y][x];
   c.onclick=()=>tap(x,y);
   b.appendChild(c);
 }
}
function tap(x,y){
 if(board[y][x]){
   sel={x,y,color:board[y][x]};
   document.getElementById("hint").innerText="Block pinili! Tap empty para i-move para mabuo line!";
   draw();
 } else if(sel){
   board[y][x]=sel.color;
   board[sel.y][sel.x]=0;
   sel=null; score+=5;
   checkClear();
   draw(); upd();
 }
}
function checkClear(){
 let cleared=0;
 for(let y=0;y<ROWS;y++) if(board[y].every(c=>c)){ board[y].fill(0); cleared++; }
 if(cleared>0){
   score+=cleared*100;
   document.getElementById("hint").innerText="🔥 "+cleared+" LINES CLEAR! +"+cleared*100+"!";
   for(let x=0;x<COLS;x++){
     let stack=[]; for(let yy=0;yy<ROWS;yy++) if(board[yy][x]) stack.push(board[yy][x]);
     for(let yy=0;yy<ROWS;yy++) board[yy][x]=0;
     for(let i=0;i<stack.length;i++) board[ROWS-stack.length+i][x]=stack[i];
   }
   if(navigator.vibrate) navigator.vibrate([30,20,60]);
 }
}
function gameOver(){
 let name=(document.getElementById("pname").value||"Mazta").trim()||"Mazta";
 lb.push({name,score,time:timer,date:new Date().toLocaleDateString()});
 lb.sort((a,b)=>b.score-a.score);
 lb=lb.slice(0,10);
 localStorage.setItem("bbLB",JSON.stringify(lb));
 if(score>best){best=score; localStorage.setItem("bbBest",best);}
 renderLB();
 alert("GAME OVER! Score:"+score+"! Na-save sa Leaderboard!");
 newGame();
}
function saveScore(){
 if(score==0){ alert("Maglaro ka muna boss!"); return; }
 gameOver();
}
function renderLB(){
 let el=document.getElementById("lbList"); el.innerHTML="";
 document.getElementById("best").innerText=best;
 document.getElementById("lbCount").innerText=lb.length+" players";
 if(!lb.length){ el.innerHTML='<div style="text-align:center;opacity:.5;font-size:11px;padding:10px">Wala pa score! Maglaro ka!</div>'; return; }
 lb.forEach((r,i)=>{
   let row=document.createElement("div"); row.className="lbRow"+(i==0?" top1":i==1?" top2":i==2?" top3":"");
   let medal=i==0?"🥇":i==1?"🥈":i==2?"🥉":"#"+(i+1);
   row.innerHTML=`<span>${medal} ${r.name}</span><span>${r.score} pts • ${r.time}s</span>`;
   el.appendChild(row);
 });
}
function toggleAuto(){ auto=!auto; document.getElementById("autoBtn").innerText=auto?"⏸️ PAUSE":"▶️ RESUME"; }
function upd(){ document.getElementById("big").innerText=score; document.getElementById("mv").innerText="Score:"+score; document.getElementById("best").innerText=best; if(score>best) best=score; }
newGame();
</script>
</body>
</html>
