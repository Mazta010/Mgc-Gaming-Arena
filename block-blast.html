<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MGC AKYAT MODE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
body{background:#2a437c;color:#fff;font-family:Arial;text-align:center}
#top{display:flex;justify-content:space-between;padding:10px 14px;font-weight:900;background:#1a2a5a;font-size:13px}
#score{font-size:56px;font-weight:900;line-height:1}
#msg{color:#ffeb3b;font-size:11px;font-weight:bold;height:18px}
#grid{width:96%;max-width:360px;height:520px;margin:0 auto;background:#16264a;border:4px solid #0e1a33;border-radius:12px;position:relative;overflow:hidden}
.bar{position:absolute;height:44px;border-radius:8px;cursor:grab;box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 3px 6px rgba(0,0,0,.6);border:2px solid rgba(0,0,0,.25);transition:top.26s ease, left.12s ease}
.bar.drag{transition:none!important;z-index:99;transform:scale(1.12)}
.c1{background:linear-gradient(180deg,#7ee8fa,#0ebfd3)}.c2{background:linear-gradient(180deg,#8ea8ff,#4b62e0)}.c3{background:linear-gradient(180deg,#ffe07a,#d69e00)}.c4{background:linear-gradient(180deg,#6ee7b7,#059669)}.c5{background:linear-gradient(180deg,#f9a8d4,#db2777)}.c6{background:linear-gradient(180deg,#fdba74,#ea580c)}.c7{background:linear-gradient(180deg,#c4b5fd,#7c3aed)}
.full{box-shadow:0 0 16px #ffeb3b!important;border-color:#ffeb3b!important}
.boom{animation:boom.38s forwards}@keyframes boom{50%{transform:scale(1.4);filter:brightness(2)}100%{transform:scale(0);opacity:0}}
.up{animation:upM.28s ease}@keyframes upM{0%{transform:translateY(52px)}100%{transform:translateY(0)}}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;background:rgba(0,0,0,.85);padding:8px 18px;border-radius:18px;animation:popUp.9s forwards;z-index:200;color:#ffeb3b}
@keyframes popUp{0%{transform:translate(-50%,0) scale(0)}60%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
button{background:#22d3ee;color:#000;border:none;padding:10px 16px;border-radius:20px;font-weight:900;margin:4px}
#over{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:500}
.inner{background:#1e2f5a;padding:20px;border-radius:14px;width:90%;max-width:320px;border:3px solid #ff3b3b;text-align:center}
</style>
</head>
<body>
<div id="top"><div>🏆 <span id="best">0</span></div><div id="pName">Mazta</div><div id="moves">Moves: 0</div></div>
<div id="score">0</div>
<div id="msg">EVERY MOVE = AKYAT! Buuin 8 para hindi mapuno!</div>
<div id="grid"></div>
<div><button onclick="start()">🔄 NEW</button><button onclick="location.href='index.html'">🏠 ARENA</button></div>

<div id="over"><div class="inner"><h2 style="color:#ff3b3b">💀 GAME OVER!</h2><p style="margin:10px 0">Napuno na taas boss!</p><p>Score: <b id="finalS">0</b> | Moves: <b id="finalM">0</b></p><button onclick="start()" style="width:100%;background:#22d3ee;margin-top:12px">🔄 ULIT</button><button onclick="location.href='index.html'" style="width:100%;background:#555;color:#fff">🏠 ARENA</button></div></div>

<script>
let W=8,H=10,cellW,cellH=52,blocks=[],score=0,moves=0,lock=false,best=0;
const cols=['c1','c2','c3','c4','c5','c6','c7'];
let player=localStorage.getItem('mgcName')||'Mazta';
best=JSON.parse(localStorage.getItem('mgcLB')||'[]')[0]?.score||0;

function newRow(y){
 let arr=[]; let x=0;
 while(x<W){
  if(Math.random()<0.75){ let len=Math.min(Math.floor(Math.random()*3)+1, W-x); // 1-3 lang para mas siksik
   arr.push({x,y,len,c:cols[Math.floor(Math.random()*cols.length)],id:Math.random()+'_'+Date.now()}); x+=len; if(Math.random()<0.35) x++; }
  else x++;
 }
 if(arr.length==0) arr.push({x:Math.floor(Math.random()*(W-1)),y,len:2,c:cols[0],id:Math.random()+''});
 return arr;
}
function start(){
 let g=document.getElementById('grid'); cellW=g.clientWidth/W; blocks=[]; score=0; moves=0; lock=false;
 document.getElementById('over').style.display='none';
 // simula 3 rows lang sa baba
 for(let y=H-3;y<H;y++) blocks=blocks.concat(newRow(y));
 render();
}
function render(){
 let g=document.getElementById('grid'); g.innerHTML=''; cellW=g.clientWidth/W;
 let fullYs=new Set();
 for(let y=0;y<H;y++){ let row=blocks.filter(b=>b.y==y); if(!row.length) continue; let cov=Array(W).fill(0); row.forEach(b=>{for(let i=0;i<b.len;i++) if(b.x+i<W) cov[b.x+i]=1;}); if(cov.every(v=>v)) fullYs.add(y); }
 blocks.forEach(b=>{
  if(b.y<0||b.y>=H) return;
  let d=document.createElement('div'); d.className='bar '+b.c+(fullYs.has(b.y)?' full':''); d.dataset.id=b.id;
  d.style.left=(b.x*cellW+2)+'px'; d.style.top=(b.y*cellH+2)+'px'; d.style.width=(b.len*cellW-6)+'px';
  d.addEventListener('touchstart',s,{passive:false}); d.addEventListener('mousedown',s);
  g.appendChild(d);
 });
 document.getElementById('score').innerText=score;
 document.getElementById('pName').innerText=player;
 document.getElementById('moves').innerText='Moves: '+moves;
 document.getElementById('best').innerText=best;
}
let drag=null;
function s(e){
 if(lock) return; e.preventDefault(); let b=blocks.find(o=>o.id==e.currentTarget.dataset.id); if(!b) return;
 let t=e.touches?e.touches[0]:e; drag={b,el:e.currentTarget,sx:t.clientX,startX:b.x,startLeft:b.x*cellW}; e.currentTarget.classList.add('drag');
 window.addEventListener('touchmove',m,{passive:false}); window.addEventListener('mousemove',m);
 window.addEventListener('touchend',eD); window.addEventListener('mouseup',eD);
}
function m(e){
 if(!drag||lock) return; e.preventDefault(); let t=e.touches?e.touches[0]:e;
 let dx=t.clientX-drag.sx; let newL=drag.startLeft+dx;
 let min=0,max=(W-drag.b.len)*cellW; if(newL<min) newL=min; if(newL>max) newL=max;
 let projX=Math.round(newL/cellW);
 let others=blocks.filter(o=>o.y==drag.b.y && o.id!=drag.b.id);
 for(let o of others){ if(!(projX+drag.b.len<=o.x || projX>=o.x+o.len)){ // harang
   if(dx>0) newL=(o.x-drag.b.len)*cellW-2; else newL=(o.x+o.len)*cellW+2; break; } }
 drag.el.style.left=newL+'px'; drag._last=newL;
}
function eD(){
 if(!drag) return;
 let b=drag.b; let finalL=drag._last!==undefined?drag._last:drag.startLeft;
 let nx=Math.round(finalL/cellW); if(nx<0) nx=0; if(nx+b.len>W) nx=W-b.len;
 let others=blocks.filter(o=>o.y==b.y && o.id!=b.id);
 let hit=others.some(o=>!(nx+b.len<=o.x || nx>=o.x+o.len));
 if(!hit) b.x=nx;
 drag.el.classList.remove('drag'); drag=null;
 window.removeEventListener('touchmove',m); window.removeEventListener('mousemove',m);
 window.removeEventListener('touchend',eD); window.removeEventListener('mouseup',eD);
 // HULOG muna pag bakante baba
 let ny=b.y; while(ny+1<H){ let below=blocks.filter(o=>o.id!=b.id && o.y==ny+1); if(below.some(o=>!(b.x+b.len<=o.x || b.x>=o.x+o.len))) break; ny++; }
 b.y=ny; render(); moves++;
 setTimeout(afterMove,80);
}
function afterMove(){
 if(lock) return;
 // check boom
 let full=[]; for(let y=0;y<H;y++){ let row=blocks.filter(b=>b.y==y); if(!row.length) continue; let cov=Array(W).fill(0); row.forEach(o=>{for(let i=0;i<o.len;i++) cov[o.x+i]=1;}); if(cov.every(v=>v)) full.push(y); }
 if(full.length){
  lock=true;
  document.querySelectorAll('.bar').forEach(el=>{ let b=blocks.find(o=>o.id==el.dataset.id); if(b&&full.includes(b.y)) el.classList.add('boom'); });
  setTimeout(()=>{
   blocks=blocks.filter(b=>!full.includes(b.y));
   // AUTO HULOG LAHAT - paulit ulit hanggang baba!
   for(let k=0;k<H;k++){ for(let y=H-1;y>=0;y--){ blocks.filter(b=>b.y==y).forEach(b=>{ while(b.y+1<H &&!blocks.some(o=>o.id!=b.id && o.y==b.y+1 &&!(b.x+b.len<=o.x || b.x>=o.x+o.len))) b.y++; }); } }
   let add=full.length*30*full.length; score+=add; if(score>best) best=score;
   let lb=JSON.parse(localStorage.getItem('mgcLB')||'[]'); lb.push({name:player,score}); lb.sort((a,b)=>b.score-a.score); lb=lb.slice(0,10); localStorage.setItem('mgcLB',JSON.stringify(lb));
   let p=document.createElement('div'); p.className='pop'; p.innerText='+'+add+' BOOM!'; document.body.appendChild(p); setTimeout(()=>p.remove(),900);
   lock=false; render(); setTimeout(afterMove,250); // chain!
  },380);
 } else {
  // WALANG BOOM = AKYAT LAHAT!
  if(blocks.some(b=>b.y<=0)){ document.getElementById('finalS').innerText=score; document.getElementById('finalM').innerText=moves; document.getElementById('over').style.display='flex'; return; }
  blocks.forEach(b=>b.y--);
  blocks=blocks.concat(newRow(H-1));
  render(); document.querySelectorAll('.bar').forEach(el=>el.classList.add('up'));
  document.getElementById('msg').innerText='⬆️ UMAKYAT! +1 NEW ROW SA BABA!';
  setTimeout(()=>document.getElementById('msg').innerText='EVERY MOVE = AKYAT! Buuin 8 para hindi mapuno!',900);
 }
}
start();
window.addEventListener('resize',()=>{ cellW=document.getElementById('grid').clientWidth/W; render(); });
</script>
</body>
</html>
