<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MGC Block Blast - EXACT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#3e5ca5;color:white;font-family:Arial;text-align:center;overflow:hidden}
#top{display:flex;justify-content:space-between;padding:15px 20px;font-size:22px;font-weight:bold}
#trophy{color:#ffb92e}
#score{font-size:70px;font-weight:900;margin:5px 0;text-shadow:0 4px 15px rgba(0,0,0,0.6)}
#grid{background:#1a2744;border:4px solid #0e1a32;border-radius:12px;width:94%;max-width:380px;margin:0 auto;position:relative;aspect-ratio:8/11;padding:4px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(11,1fr);gap:4px}
.cell{background:#24365f;border-radius:3px}
.bar{position:absolute;border-radius:6px;cursor:grab;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 4px 0 rgba(255,255,255,0.4), inset 0 -4px 0 rgba(0,0,0,0.4), 0 3px 8px rgba(0,0,0,0.5);border:2px solid rgba(0,0,0,0.2);z-index:2;transition:transform 0.1s}
.bar.drag{transform:scale(1.08);z-index:20;box-shadow:0 10px 20px rgba(0,0,0,0.7)}
.cyan{background:linear-gradient(180deg,#6ee7f5,#0ebfd3)}.blue{background:linear-gradient(180deg,#7aa8ff,#3b5bdb)}.purple{background:linear-gradient(180deg,#c4a3ff,#8b5cf6)}.yellow{background:linear-gradient(180deg,#ffe066,#f59e0b)}.red{background:linear-gradient(180deg,#ff8a8a,#dc2626)}.orange{background:linear-gradient(180deg,#ffb86a,#ea580c)}.green{background:linear-gradient(180deg,#86efac,#16a34a)}
.boom{animation:bo 0.5s forwards}
@keyframes bo{0%{transform:scale(1)}50%{transform:scale(1.3);filter:brightness(1.8)}100%{transform:scale(0);opacity:0}}
#progress{width:94%;max-width:380px;height:22px;background:#0e1a32;border-radius:10px;margin:12px auto;padding:4px;display:flex;gap:6px}
.p{height:100%;background:#22d3ee;border-radius:6px;transition:width 0.3s}
#msg{height:35px;color:#fde047;font-weight:bold;font-size:17px}
button{background:#22d3ee;color:#000;border:none;padding:10px 20px;border-radius:20px;font-weight:900;margin:5px}
.combo{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);font-size:38px;font-weight:900;color:#fff;text-shadow:0 0 20px #fbbf24;z-index:30;animation:cp 1s forwards;pointer-events:none}
@keyframes cp{0%{transform:translate(-50%,-50%) scale(0)}50%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
</style>
</head>
<body>
<div id="top"><div id="trophy">🏆 <span id="best">74520</span></div><div onclick="location.reload()">⚙️</div></div>
<div id="score">90</div>
<div id="msg">👆 HILAIN left/right para buuin ang linya!</div>
<div id="grid"></div>
<div id="progress"><div class="p" style="width:55%"></div><div class="p" style="width:15%"></div><div class="p" style="width:25%;margin-left:auto"></div></div>
<div><button onclick="init()">🔄 NEW</button><button onclick="location.href='index.html'">🏠 ARENA</button></div>
<script>
let W=8,H=11, grid=[], blocks=[], score=90, best=+localStorage.getItem('mgcBest')||74520, soundOn=true;
let timer=0, comboCount=0;
const colors=['cyan','blue','purple','yellow','red','orange','green'];
const audio=new (window.AudioContext||window.webkitAudioContext)();
function snd(t){ if(!soundOn) return; try{ const o=audio.createOscillator(),g=audio.createGain(); o.connect(g); g.connect(audio.destination); if(t=='boom'){o.frequency.value=200;o.type='sawtooth';g.gain.setValueAtTime(0.4,audio.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audio.currentTime+0.5);o.frequency.exponentialRampToValueAtTime(900,audio.currentTime+0.35);o.start();o.stop(audio.currentTime+0.5);} if(t=='triple'){[400,600,900,1200].forEach((f,i)=>{const o2=audio.createOscillator(),g2=audio.createGain();o2.connect(g2);g2.connect(audio.destination);o2.frequency.value=f;g2.gain.value=0.15;o2.start(audio.currentTime+i*0.09);o2.stop(audio.currentTime+i*0.09+0.18);});}}catch{}}
function init(){
 grid=Array(H).fill().map(()=>Array(W).fill(0)); blocks=[]; score=90; timer=0; document.getElementById('score').innerText=score;
 // create exact like pic
 let rows=[
  [{len:3,c:'cyan'},{len:2,c:'blue'}],
  [{s:2,len:2,c:'purple'},{s:1,len:3,c:'yellow'}],
  [{len:2,c:'red'},{s:1,len:2,c:'red'},{len:1,c:'blue'}],
  [{s:1,len:3,c:'orange'},{s:1,len:1,c:'cyan'}],
  [{s:1,len:1,c:'purple'},{s:1,len:1,c:'cyan'},{len:2,c:'purple'},{len:2,c:'purple'}],
  [{len:1,c:'yellow'},{len:1,c:'orange'},{len:1,c:'cyan'},{len:3,c:'red'}],
  [{len:4,c:'blue'},{len:1,c:'purple'}],
  [{len:1,c:'red'},{len:1,c:'red'},{len:3,c:'green'},{len:1,c:'blue'}],
  [{len:1,c:'cyan'},{len:3,c:'orange'},{len:1,c:'blue'},{len:1,c:'blue'}],
 ];
 rows.forEach((r,yi)=>{
  let x=0;
  r.forEach(b=>{
   if(b.s) x+=b.s;
   let id=Date.now()+Math.random()+yi+x;
   let block={id,y:2+yi,x:x,len:b.len,c:b.c};
   for(let i=0;i<b.len;i++) if(x+i<W) grid[2+yi][x+i]=id;
   blocks.push(block);
   x+=b.len;
  });
 });
 upd(); render();
}
function upd(){ document.getElementById('best').innerText=best; document.getElementById('score').innerText=score; }
function render(){
 const g=document.getElementById('grid'); g.innerHTML='';
 for(let i=0;i<W*H;i++){ let d=document.createElement('div'); d.className='cell'; g.appendChild(d); }
 let rect=g.getBoundingClientRect(); if(!rect.width) rect={width:360,height:500};
 let cw=g.clientWidth/W, ch=g.clientHeight/H;
 blocks.forEach(b=>{
  let el=document.createElement('div'); el.className='bar '+b.c; el.dataset.id=b.id;
  el.style.left=(b.x*cw+4)+'px'; el.style.top=(b.y*ch+4)+'px'; el.style.width=(b.len*cw-6)+'px'; el.style.height=(ch-6)+'px';
  el.addEventListener('touchstart',sd,{passive:false}); el.addEventListener('mousedown',sd);
  g.appendChild(el);
 });
}
let drag=null;
function sd(e){
 e.preventDefault(); const id=e.currentTarget.dataset.id; const bl=blocks.find(b=>b.id==id); if(!bl) return;
 const t=e.touches?e.touches[0]:e; drag={id, bl, sx:t.clientX, startX:bl.x}; e.currentTarget.classList.add('drag');
 window.addEventListener('touchmove',mv,{passive:false}); window.addEventListener('mousemove',mv);
 window.addEventListener('touchend',ed); window.addEventListener('mouseup',ed);
}
function mv(e){
 if(!drag) return; e.preventDefault(); const t=e.touches?e.touches[0]:e;
 let g=document.getElementById('grid'); let cw=g.clientWidth/W;
 let dx=Math.round((t.clientX-drag.sx)/cw);
 let nx=drag.startX+dx;
 if(nx<0) nx=0; if(nx+drag.bl.len>W) nx=W-drag.bl.len;
 if(nx==drag.bl.x) return;
 // check collision sa row lang
 let can=true;
 for(let i=0;i<drag.bl.len;i++){ let gx=nx+i, gy=drag.bl.y; let other=blocks.find(b=>b.id!=drag.id && b.y==gy && gx>=b.x && gx<b.x+b.len); if(other) can=false; }
 if(!can) return;
 drag.bl.x=nx; render(); document.querySelector(`[data-id="${drag.id}"]`)?.classList.add('drag');
}
function ed(){
 if(!drag) return; document.querySelector(`[data-id="${drag.id}"]`)?.classList.remove('drag'); drag=null;
 window.removeEventListener('touchmove',mv); window.removeEventListener('mousemove',mv);
 window.removeEventListener('touchend',ed); window.removeEventListener('mouseup',ed);
 checkLines();
}
function checkLines(){
 let rowsToClear=[];
 for(let y=0;y<H;y++){
  let filled=0; for(let x=0;x<W;x++) if(blocks.some(b=>b.y==y && x>=b.x && x<b.x+b.len)) filled++;
  if(filled>=W) rowsToClear.push(y);
 }
 if(!rowsToClear.length){
  timer++; if(timer>4){ pop('⬆️ TUMATAAS!'); blocks.forEach(b=>b.y--); blocks=blocks.filter(b=>b.y>=0); if(blocks.some(b=>b.y<0)){ alert('GAME OVER! '+score); init(); return; } spawnNewRow(); timer=0; }
  render(); return;
 }
 // BOOM!
 timer=0;
 rowsToClear.forEach(y=>{ document.querySelectorAll('.bar').forEach(el=>{ let b=blocks.find(bl=>bl.id==el.dataset.id); if(b&&b.y==y) el.classList.add('boom'); }); });
 snd(rowsToClear.length>=3?'triple':'boom');
 setTimeout(()=>{
  rowsToClear.sort((a,b)=>b-a).forEach(y=>{
   blocks=blocks.filter(b=>b.y!=y);
   blocks.forEach(b=>{ if(b.y<y) b.y++; });
  });
  let add=rowsToClear.length*100*rowsToClear.length;
  score+=add; if(score>best){best=score; localStorage.setItem('mgcBest',best);}
  if(rowsToClear.length==1){ pop('BOOM! 💥 +'+add); document.getElementById('msg').innerText='💥 BOOM! Nice one boss!';}
  else if(rowsToClear.length==2){ pop('DOUBLE! 🔥🔥'); document.getElementById('msg').innerText='DOUBLE CLEAR! Galing! 😎 +'+add;}
  else if(rowsToClear.length==3){ pop('TRIPLE! 👑👑👑'); document.getElementById('msg').innerText='TRIPLE COMBO! LUPIT! 👑 +'+add;}
  else{ pop('PENTA! 🚀 GODLIKE!'); document.getElementById('msg').innerText='MEGA CLEAR! LEGEND KA BOSS! 🚀 +'+add;}
  spawnNewRow(); upd(); render();
  if(score>500) {document.body.style.background='#5b3b9a'; pop('STAGE 2! ✨');}
  if(score>1200) {document.body.style.background='#9a3b5b';}
 },450);
}
function spawnNewRow(){
 let y=H-1; let x=0; while(x<W){
  if(Math.random()>0.3){ let len=Math.floor(Math.random()*3)+1; if(x+len>W) len=W-x; let c=colors[Math.floor(Math.random()*colors.length)]; let id=Date.now()+Math.random(); blocks.push({id,y,x,len,c}); x+=len; } x+=Math.random()>0.6?1:0;
 }
}
function pop(t){ let d=document.createElement('div'); d.className='combo'; d.innerText=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1100); }
init(); window.addEventListener('resize',render);
</script>
</body>
</html>
