<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MGC Block Blast FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#3e5fa6;color:white;font-family:Arial;text-align:center;overflow:hidden}
#top{display:flex;justify-content:space-between;padding:14px 20px;font-weight:900;font-size:20px}
#best{color:#ffce3a}
#score{font-size:72px;font-weight:900;text-shadow:0 4px 15px #000;margin:4px}
#msg{height:40px;color:#ffe86a;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:center}
#grid{width:94%;max-width:360px;margin:0 auto;background:#192a4d;border:4px solid #0f1c33;border-radius:12px;padding:5px;display:grid;grid-template-rows:repeat(10,1fr);gap:5px;aspect-ratio:8/10.5}
.row{position:relative;width:100%;height:100%;background:#24365f;border-radius:4px;display:block}
.bar{position:absolute;top:2px;bottom:2px;border-radius:7px;cursor:grab;box-shadow:inset 0 3px 0 rgba(255,255,255,0.5), inset 0 -3px 0 rgba(0,0,0,0.4), 0 2px 5px rgba(0,0,0,0.5);border:1px solid rgba(0,0,0,0.3);display:flex}
.bar.drag{z-index:10;transform:scale(1.08) rotate(1deg);box-shadow:0 8px 18px #000}
.c1{background:linear-gradient(180deg,#7ee8fa,#0ebfd3)}.c2{background:linear-gradient(180deg,#8ea8ff,#4b62e0)}.c3{background:linear-gradient(180deg,#d1a8ff,#8a5cf6)}.c4{background:linear-gradient(180deg,#ffe58a,#f59e0b)}.c5{background:linear-gradient(180deg,#ff9a9a,#e11d48)}.c6{background:linear-gradient(180deg,#ffb86c,#ea580c)}
.boom{animation:boom 0.4s forwards}
@keyframes boom{0%{transform:scale(1)}50%{transform:scale(1.3);filter:brightness(1.8)}100%{transform:scale(0);opacity:0}}
#barW{width:94%;max-width:360px;height:18px;background:#0f1c33;border-radius:9px;margin:12px auto;padding:3px;display:flex;gap:3px}
.p{height:100%;border-radius:6px;background:#22d3ee;transition:width 0.3s}
.combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);font-size:38px;font-weight:900;color:#fff;text-shadow:0 0 18px #fbbf24;animation:pop 0.9s forwards;pointer-events:none;z-index:20}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}60%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
button{background:#22d3ee;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:900;margin:4px}
</style>
</head>
<body>
<div id="top"><div>🏆 <span id="b">74520</span></div><div>⚙️</div></div>
<div id="score">90</div>
<div id="msg">👆 HILAIN! 1-4 haba lang! Buuin 8 para sumabog!</div>
<div id="grid"></div>
<div id="barW"><div class="p" style="width:60%"></div><div class="p" style="width:20%"></div><div class="p" style="width:15%;margin-left:auto;background:#f59e0b"></div></div>
<div><button onclick="init()">🔄 NEW</button><button onclick="location.href='index.html'">🏠 ARENA</button><button onclick="soundOn=!soundOn;this.innerText=soundOn?'🔊 ON':'🔇 OFF'">🔊 ON</button></div>
<script>
let W=8,H=10,rows=[],score=90,best=+localStorage.getItem('mgcBest')||74520,soundOn=true,timer=0;
const colors=['c1','c2','c3','c4','c5','c6'];
const audio=new (window.AudioContext||window.webkitAudioContext)();
function snd(t){if(!soundOn) return; try{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);if(t=='b'){o.frequency.value=180;o.type='sawtooth';g.gain.setValueAtTime(0.35,audio.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audio.currentTime+0.45);o.frequency.exponentialRampToValueAtTime(850,audio.currentTime+0.35);o.start();o.stop(audio.currentTime+0.5);} if(t=='c'){[350,600,900,1200].forEach((f,i)=>{const o2=audio.createOscillator(),g2=audio.createGain();o2.connect(g2);g2.connect(audio.destination);o2.frequency.value=f;g2.gain.value=0.13;o2.start(audio.currentTime+i*0.08);o2.stop(audio.currentTime+i*0.08+0.16);});}}catch{}}
function init(){
 rows=[]; score=90; timer=0;
 for(let y=0;y<H;y++){
  let r=[]; let x=0;
  while(x<W){
   if(Math.random()<0.75){
    let len=Math.floor(Math.random()*4)+1; // 1 to 4 ONLY boss!
    if(x+len>W) len=W-x;
    if(len>0){ r.push({x,len,c:colors[Math.floor(Math.random()*colors.length)],id:Math.random()}); x+=len; }
   }else{ x++; }
   if(Math.random()<0.25) x++; // gap
  }
  rows.push(r);
 }
 upd(); render();
}
function upd(){document.getElementById('b').innerText=best; document.getElementById('score').innerText=score; document.querySelector('#barW.p').style.width=(100-timer*18)+'%';}
function render(){
 const g=document.getElementById('grid'); g.innerHTML='';
 rows.forEach((r,y)=>{
  let row=document.createElement('div'); row.className='row';
  r.forEach(b=>{
   let el=document.createElement('div'); el.className='bar '+b.c; el.dataset.y=y; el.dataset.id=b.id;
   el.style.left=(b.x/W*100)+'%'; el.style.width=(b.len/W*100-1.2)+'%';
   el.addEventListener('touchstart',sd,{passive:false}); el.addEventListener('mousedown',sd);
   row.appendChild(el);
  });
  g.appendChild(row);
 });
}
let drag=null;
function sd(e){
 e.preventDefault(); const y=+e.currentTarget.dataset.y, id=e.currentTarget.dataset.id;
 const b=rows[y].find(o=>o.id==id); if(!b) return;
 const t=e.touches?e.touches[0]:e; drag={y,b,sx:t.clientX,startX:b.x}; e.currentTarget.classList.add('drag');
 window.addEventListener('touchmove',mv,{passive:false}); window.addEventListener('mousemove',mv);
 window.addEventListener('touchend',ed); window.addEventListener('mouseup',ed);
}
function mv(e){
 if(!drag) return; e.preventDefault(); const t=e.touches?e.touches[0]:e;
 let gridW=document.getElementById('grid').clientWidth; let cellW=gridW/W;
 let dx=Math.round((t.clientX-drag.sx)/cellW);
 let nx=drag.startX+dx; if(nx<0) nx=0; if(nx+drag.b.len>W) nx=W-drag.b.len;
 if(nx==drag.b.x) return;
 // check collision
 let other=rows[drag.y].some(o=>o.id!=drag.b.id &&!(nx+drag.b.len<=o.x || nx>=o.x+o.len));
 if(other) return;
 drag.b.x=nx; render(); document.querySelector(`[data-id="${drag.b.id}"]`)?.classList.add('drag');
}
function ed(){
 if(!drag) return; document.querySelector(`[data-id="${drag.b.id}"]`)?.classList.remove('drag'); drag=null;
 window.removeEventListener('touchmove',mv); window.removeEventListener('mousemove',mv);
 window.removeEventListener('touchend',ed); window.removeEventListener('mouseup',ed);
 check();
}
function check(){
 let clear=[];
 rows.forEach((r,y)=>{
  let fill=0; r.forEach(b=>fill+=b.len);
  // check if full 8 AND no gaps (buo talaga)
  if(fill>=W){
   let covered=Array(W).fill(0); r.forEach(b=>{for(let i=0;i<b.len;i++) covered[b.x+i]=1;});
   if(covered.every(v=>v)) clear.push(y);
  }
 });
 if(!clear.length){
  timer++; if(timer>=5){ // umakyat!
   if(rows[0].length>0){ alert('GAME OVER! Score: '+score); init(); return; }
   rows.shift(); rows.push([]); spawnBottom(); timer=0; pop('⬆️ TUMAAS!'); }
  upd(); return;
 }
 timer=0; snd(clear.length>=2?'c':'b');
 clear.forEach(y=>{ document.querySelectorAll(`[data-y="${y}"]`).forEach(el=>el.classList.add('boom')); });
 setTimeout(()=>{
  // remove rows
  clear.sort((a,b)=>b-a).forEach(y=>rows.splice(y,1));
  for(let i=0;i<clear.length;i++) rows.push([]); // new empty at bottom then fill
  for(let i=0;i<clear.length;i++) spawnBottom();
  let add=clear.length*100*clear.length;
  score+=add; if(score>best){best=score; localStorage.setItem('mgcBest',best);}
  if(clear.length==1){ pop('BOOM! 💥 +'+add); document.getElementById('msg').innerText='BOOM! Nice! +'+add;}
  else if(clear.length==2){ pop('DOUBLE! 🔥🔥'); document.getElementById('msg').innerText='DOUBLE CLEAR! 😎 +'+add;}
  else if(clear.length==3){ pop('TRIPLE! 👑'); document.getElementById('msg').innerText='TRIPLE COMBO! 👑 +'+add;}
  else{ pop('MEGA '+clear.length+'! 🚀'); document.getElementById('msg').innerText='MEGA CLEAR LEGEND! 🚀 +'+add;}
  if(score>500) document.body.style.background='#5b3b9a';
  if(score>1200) document.body.style.background='#9a3b5b';
  upd(); render();
 },380);
}
function spawnBottom(){
 let y=H-1; let r=[]; let x=0;
 while(x<W){
  if(Math.random()<0.7){ let len=Math.floor(Math.random()*4)+1; if(x+len>W) len=W-x; if(len>0){r.push({x,len,c:colors[Math.floor(Math.random()*colors.length)],id:Math.random()}); x+=len;} } x+=Math.random()<0.3?1:0;
 }
 rows[rows.length-1]=r;
}
function pop(t){let d=document.createElement('div'); d.className='combo'; d.innerText=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1000);}
init();
</script>
</body>
</html>
