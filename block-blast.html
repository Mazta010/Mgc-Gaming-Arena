<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Block Blast RISING - Original</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;touch-action:manipulation;user-select:none}
body{background:#1e3a8a;min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#fff}
.top{width:100%;background:#0f172a;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:900;border-bottom:2px solid #22d3ee;position:sticky;top:0;z-index:99}
.top a{background:#020617;border:2px solid #22d3ee;color:#22d3ee;padding:6px 16px;border-radius:20px;text-decoration:none}
#board{width:92vw;max-width:380px;aspect-ratio:1;background:#0f172a;border-radius:16px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:5px;padding:10px;margin-top:10px;border:3px solid #1e293b}
.cell{background:#1e293b;border-radius:6px}
.cell.f{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 8px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2)}
#tray{width:94%;max-width:390px;background:#0f172a;border-radius:14px;padding:12px;margin-top:12px;display:flex;gap:10px;justify-content:center}
.b{height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;box-shadow:inset 0 3px 0 rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.2);cursor:pointer}
.b.w1{width:70px}.b.w2{width:110px}.b.w3{width:150px}.b.w4{width:190px}
.b.sel{outline:3px solid #22d3ee;box-shadow:0 0 15px #22d3ee;transform:scale(1.05)}
#hint{font-size:11px;color:#22d3ee;font-weight:800;margin:8px;text-align:center}
</style>
</head>
<body>
<div class="top"><a href="index.html">← ARENA</a><span>🏆<span id="best">0</span></span><span>RISING MODE ⬆️</span><span>Moves:<b id="mv">0</b></span></div>
<div style="font-size:50px;font-weight:900;margin:8px 0" id="sc">0</div>
<div style="color:#facc15;font-size:11px;font-weight:800">UMAATYAT PAG NAGLAGAY KA NG BLOCK! ⬆️</div>
<div id="board"></div>
<div id="hint">TAP BLOCK (1-4) → TAP BOARD PARA IHULOG!</div>
<div id="tray"></div>
<div style="display:flex;gap:10px;margin:16px 0 30px"><button onclick="newGame()" style="padding:12px 20px;border-radius:12px;border:none;font-weight:900">🔄 NEW</button><a href="index.html" style="padding:12px 20px;border-radius:12px;background:#0f172a;border:2px solid #22d3ee;color:#22d3ee;text-decoration:none;font-weight:900">🏠 ARENA</a></div>

<script>
const C=8,R=8,COLORS=["#f472b6","#60a5fa","#34d399","#facc15","#fb923c","#a78bfa","#22d3ee"];
let board,score,moves,best=+localStorage.getItem("bbBest")||0,sel=null,tray=[],hasPlaced=false;

function newGame(){
 board=Array.from({length:R},()=>Array(C).fill(0));score=0;moves=0;sel=null;hasPlaced=false;
 document.getElementById("best").innerText=best; genTray(); draw(); upd();
}
function genTray(){
 tray=[];
 for(let i=0;i<4;i++){ let w=[1,2,3,4][Math.floor(Math.random()*4)]; tray.push({id:Math.random(),w,col:COLORS[Math.floor(Math.random()*COLORS.length)]}) }
 drawTray();
}
function drawTray(){
 let el=document.getElementById("tray"); el.innerHTML="";
 tray.forEach(d=>{
   let b=document.createElement("div"); b.className="b w"+d.w+(sel&&sel.id==d.id?" sel":""); b.style.background=d.col; b.innerText=d.w;
   b.onclick=()=>{sel=d; document.getElementById("hint").innerText="Block "+d.w+" pinili! Tap board!"; drawTray();};
   el.appendChild(b);
 });
}
function draw(){
 let b=document.getElementById("board"); b.innerHTML="";
 for(let y=0;y<R;y++) for(let x=0;x<C;x++){
   let c=document.createElement("div"); c.className="cell"+(board[y][x]?" f":""); if(board[y][x]) c.style.background=board[y][x];
   c.onclick=()=>drop(x);
   b.appendChild(c);
 }
}
function drop(col){
 if(!sel){ document.getElementById("hint").innerText="PILI KA MUNA BLOCK 1-4!"; return; }
 if(col+sel.w>C) col=C-sel.w;
 let target=-1;
 for(let y=R-1;y>=0;y--){ let ok=true; for(let i=0;i<sel.w;i++) if(board[y][col+i]) ok=false; if(ok){target=y; break;} }
 if(target==-1){ document.getElementById("hint").innerText="Puno!"; return; }
 for(let i=0;i<sel.w;i++) board[target][col+i]=sel.col;
 tray=tray.filter(t=>t.id!=sel.id); sel=null; moves++; score+=10; hasPlaced=true;
 // CLEAR
 let clr=0; for(let y=0;y<R;y++) if(board[y].every(v=>v)){ board[y].fill(0); clr++; }
 if(clr) score+=clr*100;
 // GRAVITY
 for(let x=0;x<C;x++){ let stack=[]; for(let y=0;y<R;y++) if(board[y][x]) stack.push(board[y][x]); for(let y=0;y<R;y++) board[y][x]=0; for(let i=0;i<stack.length;i++) board[R-stack.length+i][x]=stack[i]; }
 // RISING - ETO YUNG UMAAKYAT BOSS!
 if(hasPlaced){
   riseBoard();
   hasPlaced=false;
 }
 if(tray.length<2) genTray(); else drawTray();
 if(score>best){best=score; localStorage.setItem("bbBest",best);}
 draw(); upd();
 if(board[0].some(c=>c)){ setTimeout(()=>{alert("GAME OVER! Naabot na taas! Score:"+score); newGame();},300); }
}
function riseBoard(){
 // UMAAKYAT - push up 1 row!
 for(let y=0;y<R-1;y++) board[y]=[...board[y+1]];
 let newRow=Array(C).fill(0);
 for(let x=0;x<C;x++) if(Math.random()<0.25) newRow[x]=COLORS[Math.floor(Math.random()*COLORS.length)];
 board[R-1]=newRow;
 document.getElementById("hint").innerText="⬆️ TUMAAS! Bilisan mo!";
}
function upd(){ document.getElementById("sc").innerText=score; document.getElementById("mv").innerText=moves; document.getElementById("best").innerText=best; }
newGame();
</script>
</body>
</html>
