<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Block Blast - Video Replica + LB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#2a4cb8;min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#fff}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:900}
.top.trophy{color:#facc15;font-size:16px;display:flex;align-items:center;gap:6px}
#board{width:92vw;max-width:380px;aspect-ratio:0.9;background:#1a2f6b;border-radius:8px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(10,1fr);gap:4px;padding:6px;position:relative;border:3px solid #1e3a8a}
.cell{background:rgba(0,0,0,.15);border-radius:4px}
.block{position:absolute;height:36px;border-radius:6px;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 3px 6px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:grab;transition:transform.1s}
.block.dragging{transform:scale(1.05);z-index:99;box-shadow:0 0 20px rgba(34,211,238,.8)}
#progress{width:92vw;max-width:380px;height:10px;background:#0f172a;border-radius:10px;margin-top:8px;display:flex;gap:4px;padding:2px;overflow:hidden}
.seg{flex:1;background:#1e293b;border-radius:10px;transition:.3s}
.seg.fill{background:#22d3ee;box-shadow:0 0 8px #22d3ee}
.scoreMid{font-size:56px;font-weight:900;margin:4px 0;line-height:1}
.lb{width:94%;max-width:380px;background:#0f172a;border-radius:14px;padding:12px;margin-top:14px;border:2px solid #334155}
.lbRow{display:flex;justify-content:space-between;padding:7px 10px;background:#020617;border-radius:8px;margin-bottom:5px;font-size:11px;font-weight:800}
.lbRow.top1{border:2px solid #facc15}
</style>
</head>
<body>
<div class="top">
<div class="trophy">🏆 <span id="best">74520</span></div>
<div style="font-size:20px">⚙️</div>
</div>
<div class="scoreMid" id="score">0</div>
<div id="board"></div>
<div id="progress"></div>
<div style="font-size:10px;color:#22d3ee;font-weight:800;margin:8px" id="hint">DRAG BLOCKS LEFT/RIGHT PARA MAPUNO LINE!</div>

<div style="display:flex;gap:8px;margin:6px 0 10px">
<button onclick="newGame()" style="padding:10px 18px;border-radius:10px;border:none;font-weight:900;background:#e2e8f0">🔄 NEW</button>
<button onclick="togglePause()" id="pauseBtn" style="padding:10px 18px;border-radius:10px;border:none;font-weight:900;background:#22d3ee">⏸️ PAUSE</button>
<a href="index.html" style="padding:10px 18px;border-radius:10px;background:#0f172a;border:2px solid #22d3ee;color:#22d3ee;text-decoration:none;font-weight:900">🏠 ARENA</a>
</div>

<div class="lb">
<div style="display:flex;justify-content:space-between;font-weight:900;color:#22d3ee;font-size:12px;margin-bottom:8px"><span>🏆 LEADERBOARD TOP 10</span><span id="lbCount">0</span></div>
<div id="lbList"></div>
<div style="display:flex;gap:6px;margin-top:10px">
<input id="pname" value="Mazta" placeholder="Name" style="flex:1;padding:9px;border-radius:8px;border:1px solid #334155;background:#020617;color:#fff;font-weight:800;font-size:11px">
<button onclick="saveScore()" style="padding:9px 14px;border-radius:8px;border:none;background:#22d3ee;font-weight:900;font-size:11px">SAVE</button>
</div>
</div>

<script>
const COLS=8, ROWS=10, COLORS=["#5a8dee","#f87171","#34d399","#facc15","#fb923c","#a78bfa","#22d3ee","#f472b6","#4ade80"];
let board=[], blocks=[], score=0, best=parseInt(localStorage.getItem("bbBest")||"74520"), prog=0, paused=false, selBlock=null, startX=0, origLeft=0;
let lb=JSON.parse(localStorage.getItem("bbLB")||"[]");

function newGame(){
 board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
 blocks=[]; score=0; prog=0; selBlock=null;
 document.getElementById("best").innerText=best;
 // initial 2 rows tulad sa video
 spawnRow(); spawnRow();
 draw(); upd(); renderLB(); drawProgress();
}
function spawnRow(){
 // push up
 for(let y=0;y<ROWS-1;y++) board[y]=[...board[y+1]];
 let newRow=Array(COLS).fill(0);
 let rowBlocks=[];
 let x=0;
 while(x<COLS){
   if(Math.random()<0.6){
     let w=[1,2,3][Math.floor(Math.random()*3)]; // 1-3 sa video
     if(x+w>COLS) w=COLS-x;
     if(w>0){
       let col=COLORS[Math.floor(Math.random()*COLORS.length)];
       let id=Math.random().toString(36).slice(2);
       for(let i=0;i<w;i++) newRow[x+i]=id;
       rowBlocks.push({id,x,w,col,y:ROWS-1});
       x+=w+ (Math.random()<0.6?1:0);
     } else x++;
   } else x++;
 }
 board[ROWS-1]=newRow;
 rowBlocks.forEach(b=>blocks.push(b));
 if(board[0].some(c=>c)){ gameOver(); }
}
function draw(){
 let bEl=document.getElementById("board"); bEl.querySelectorAll(".block").forEach(e=>e.remove());
 // draw blocks as absolute
 blocks.forEach(bl=>{
   let div=document.createElement("div");
   div.className="block";
   div.style.background=bl.col;
   div.style.width=`calc(${(bl.w/COLS)*100}% - 4px)`;
   div.style.height=`36px`;
   div.style.left=`calc(${(bl.x/COLS)*100}% + 2px)`;
   div.style.top=`calc(${(bl.y/ROWS)*100}% + 2px)`;
   div.dataset.id=bl.id;
   div.addEventListener("touchstart", startDrag,{passive:false});
   div.addEventListener("mousedown", startDrag);
   bEl.appendChild(div);
 });
}
function startDrag(e){
 e.preventDefault();
 let id=e.target.dataset.id;
 selBlock=blocks.find(b=>b.id==id);
 if(!selBlock) return;
 selBlock.el=e.target;
 selBlock.el.classList.add("dragging");
 startX=e.touches?e.touches[0].clientX:e.clientX;
 origLeft=selBlock.x;
 let move=(ev)=>{
   let cx=ev.touches?ev.touches[0].clientX:ev.clientX;
   let dx=cx-startX;
   let colW=document.getElementById("board").clientWidth/COLS;
   let dCols=Math.round(dx/colW);
   let newX=Math.max(0,Math.min(COLS-selBlock.w, origLeft+dCols));
   // check collision sa row nya
   let can=true;
   for(let i=0;i<selBlock.w;i++){
     let checkX=newX+i;
     if(board[selBlock.y][checkX] && board[selBlock.y][checkX]!=selBlock.id) {
       // check if occupied by other block same row
       let other=blocks.find(b=>b.y==selBlock.y && b.id!=selBlock.id && checkX>=b.x && checkX<b.x+b.w);
       if(other) can=false;
     }
   }
   if(can){
     // clear old
     for(let i=0;i<COLS;i++) if(board[selBlock.y][i]==selBlock.id) board[selBlock.y][i]=0;
     selBlock.x=newX;
     for(let i=0;i<selBlock.w;i++) board[selBlock.y][newX+i]=selBlock.id;
     selBlock.el.style.left=`calc(${(newX/COLS)*100}% + 2px)`;
     checkLine(selBlock.y);
   }
 };
 let up=()=>{
   if(selBlock&&selBlock.el) selBlock.el.classList.remove("dragging");
   selBlock=null;
   document.removeEventListener("touchmove",move);
   document.removeEventListener("mousemove",move);
   document.removeEventListener("touchend",up);
   document.removeEventListener("mouseup",up);
 };
 document.addEventListener("touchmove",move,{passive:false});
 document.addEventListener("mousemove",move);
 document.addEventListener("touchend",up);
 document.addEventListener("mouseup",up);
}
function checkLine(y){
 if(board[y].every(c=>c)){
   // clear animation
   score+=30;
   document.getElementById("hint").innerText="Good! +30 🔥";
   // remove blocks in that row
   let ids=[...new Set(board[y])];
   ids.forEach(id=>{ blocks=blocks.filter(b=>b.id!=id); });
   board[y].fill(0);
   // gravity - baba lahat sa taas
   for(let yy=y;yy>0;yy--) board[yy]=[...board[yy-1]];
   board[0]=Array(COLS).fill(0);
   // adjust block y
   blocks.forEach(b=>{ if(b.y<y) b.y++; });
   // after clear, rebuild board from blocks positions? simplified: re-sync
   upd(); draw();
   setTimeout(()=>document.getElementById("hint").innerText="DRAG BLOCKS PARA MAPUNO LINE!",800);
 }
}
function drawProgress(){
 let p=document.getElementById("progress"); p.innerHTML="";
 for(let i=0;i<5;i++){ let s=document.createElement("div"); s.className="seg"+(i<prog?" fill":""); p.appendChild(s); }
}
let progInt=setInterval(()=>{
 if(paused) return;
 prog++;
 if(prog>=5){ prog=0; spawnRow(); draw(); }
 drawProgress();
},600);

function gameOver(){
 lb.push({name:document.getElementById("pname").value||"Mazta",score,date:new Date().toLocaleDateString()});
 lb.sort((a,b)=>b.score-a.score); lb=lb.slice(0,10);
 localStorage.setItem("bbLB",JSON.stringify(lb));
 if(score>best){best=score; localStorage.setItem("bbBest",best);}
 renderLB();
 alert("GAME OVER! Score:"+score);
 newGame();
}
function saveScore(){ if(score==0) return alert("Maglaro muna!"); gameOver(); }
function renderLB(){
 let el=document.getElementById("lbList"); el.innerHTML="";
 document.getElementById("lbCount").innerText=lb.length+" players";
 document.getElementById("best").innerText=best;
 if(!lb.length){ el.innerHTML='<div style="opacity:.5;font-size:10px;text-align:center;padding:8px">Wala pa score</div>'; return; }
 lb.forEach((r,i)=>{
   let row=document.createElement("div"); row.className="lbRow"+(i==0?" top1":"");
   row.innerHTML=`<span>${i==0?"🥇":i==1?"🥈":i==2?"🥉":"#"+(i+1)} ${r.name}</span><span>${r.score}</span>`;
   el.appendChild(row);
 });
}
function togglePause(){ paused=!paused; document.getElementById("pauseBtn").innerText=paused?"▶️ RESUME":"⏸️ PAUSE"; }
function upd(){ document.getElementById("score").innerText=score; }
newGame();
</script>
</body>
</html>
