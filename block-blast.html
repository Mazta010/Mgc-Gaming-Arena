<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Block Blast - MGC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;font-family:system-ui}
body{background:#1e3a8a;min-height:100dvh;display:flex;flex-direction:column;align-items:center;color:#fff}
.topbar{width:100%;background:#1e293b;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-weight:900;font-size:13px;position:relative;z-index:10}
.topbar-left{display:flex;align-items:center;gap:8px}
.backArena{background:#0f172a;border:2px solid #22d3ee;color:#22d3ee;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900;text-decoration:none}
.scoreBig{font-size:64px;font-weight:900;margin:4px 0;line-height:1}
.sub{color:#facc15;font-weight:800;font-size:13px;margin-bottom:6px}
.boardWrap{width:92%;max-width:380px;background:#0f172a;border:4px solid #1e293b;border-radius:18px;padding:8px;flex:1;display:flex;flex-direction:column;min-height:60vh}
#board{flex:1;background:#162447;border-radius:12px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:4px;padding:8px;position:relative;min-height:360px}
.cell{background:rgba(255,255,255,.05);border-radius:6px;transition:.2s}
.cell.filled{box-shadow:inset 0 2px 0 rgba(255,255,255,.3), 0 3px 6px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2)}
.blocksTray{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:auto;padding-top:10px}
.block{height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.4), 0 4px 8px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);cursor:grab}
.block:active{transform:scale(.92)}
.block.w1{grid-column:span 1}
.block.w2{grid-column:span 2}
.block.w3{grid-column:span 3}
.nextHint{width:92%;max-width:380px;background:rgba(15,23,42,.8);border:1px dashed #22d3ee;border-radius:10px;padding:8px;margin-top:8px}
.nextTitle{font-size:10px;font-weight:800;opacity:.7;display:flex;justify-content:space-between}
#nextRow{display:flex;gap:6px;margin-top:6px;justify-content:center}
.mini{width:36px;height:18px;border-radius:6px;opacity:.8}
.bottomBtns{display:flex;gap:10px;margin:12px 0 20px}
.bbtn{padding:10px 22px;border-radius:20px 20px 0 0;font-weight:900;font-size:13px;border:none;cursor:pointer}
.bbtn.new{background:#e2e8f0;color:#0f172a}
.bbtn.sound{background:#38bdf8;color:#000}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="backArena">← ARENA</a>
    <span>🏆 36990</span>
  </div>
  <span>Mazta</span>
  <span>Moves: <b id="moves">0</b></span>
</div>

<div class="scoreBig" id="score">0</div>
<div class="sub">SOUNDS ON 🔊 Instant hulog!</div>

<div class="boardWrap">
  <div id="board"></div>
  <div class="blocksTray" id="tray"></div>
</div>

<div class="nextHint">
  <div class="nextTitle"><span>🔜 NEXT (tataas lang pag naglagay ka)</span><span id="status" style="color:#22d3ee">Ready</span></div>
  <div id="nextRow"></div>
</div>

<div class="bottomBtns">
  <button class="bbtn new" onclick="newGame()">🔄 NEW</button>
  <button class="bbtn sound" id="soundBtn" onclick="toggleSound()">🔊 SOUND ON</button>
  <a href="index.html" class="bbtn new" style="text-decoration:none;background:#0f172a;color:#22d3ee;border:1px solid #22d3ee">🏠 ARENA</a>
</div>

<script>
const COLS=8, ROWS=8;
const COLORS=['#22d3ee','#60a5fa','#34d399','#f472b6','#facc15','#fb923c','#a78bfa','#f87171'];
let board=[], score=0, moves=0, soundOn=true, selected=null, nextBlocks=[], hasPlaced=false;
let audioCtx=null;

function initAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }
function beep(f,d){ if(!soundOn||!audioCtx) return; let o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.2,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d); o.start(); o.stop(audioCtx.currentTime+d); }

function newGame(){
 board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
 score=0; moves=0; hasPlaced=false;
 genTray(); genNext(); render();
 updateUI();
}

function genTray(){
 let tray=document.getElementById('tray'); tray.innerHTML='';
 // 8-10 random blocks katulad sa screenshot mo
 for(let i=0;i<9;i++){
   let w=[1,1,1,2,2,3][Math.floor(Math.random()*6)];
   let c=COLORS[Math.floor(Math.random()*COLORS.length)];
   let b=document.createElement('div'); b.className=`block w${w}`; b.style.background=c; b.dataset.w=w; b.dataset.c=c; b.dataset.idx=i;
   b.onclick=()=>placeBlock(b);
   tray.appendChild(b);
 }
}

function genNext(){
 nextBlocks=[];
 for(let i=0;i<5;i++){
   let w=[1,1,2,2,3][Math.floor(Math.random()*5)];
   nextBlocks.push({w, c:COLORS[Math.floor(Math.random()*COLORS.length)]});
 }
 renderNext();
}

function renderNext(){
 let row=document.getElementById('nextRow'); row.innerHTML='';
 nextBlocks.forEach(n=>{
   let m=document.createElement('div'); m.className='mini'; m.style.background=n.c; m.style.width=(n.w*22)+'px';
   row.appendChild(m);
 });
}

function render(){
 let b=document.getElementById('board'); b.innerHTML='';
 for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
   let cell=document.createElement('div'); cell.className='cell'+(board[y][x]?' filled':''); if(board[y][x]) cell.style.background=board[y][x];
   cell.onclick=()=>tryDrop(x,y);
   b.appendChild(cell);
 }
 // re-add tray blocks na hindi pa nalagay
}

function placeBlock(el){
 selected={w:parseInt(el.dataset.w), c:el.dataset.c, el};
 document.querySelectorAll('.block').forEach(b=>b.style.outline='');
 el.style.outline='3px solid #22d3ee';
 beep(400,0.08);
 document.getElementById('status').innerText='Tap board para ilagay';
}

function tryDrop(x,y){
 if(!selected) { document.getElementById('status').innerText='Pili ka muna block sa baba!'; return; }
 let w=selected.w;
 if(x+w>COLS) x=COLS-w;
 // check empty sa baba ng drop point
 if(!canPlace(x,0,w)){ document.getElementById('status').innerText='Puno na!'; return; }
 // hanapin pinakababa na pwede (hulog logic)
 let dropY=0;
 for(let ty=0;ty<ROWS;ty++){ if(canPlace(x,ty,w)) dropY=ty; else break; }
 // place
 for(let i=0;i<w;i++) board[dropY][x+i]=selected.c;
 // remove from tray
 selected.el.remove();
 selected=null;
 moves++; score+=w*10; hasPlaced=true;
 beep(300,0.05); setTimeout(()=>beep(600,0.12),60);
 checkLines();
 applyGravity(); // FIX: hulog lahat pag empty sa baba
 genNextIfNeeded();
 render(); updateUI();
}

function canPlace(x,y,w){
 if(y>=ROWS) return false;
 for(let i=0;i<w;i++) if(board[y][x+i]) return false;
 return true;
}

function applyGravity(){
 // FIX BOSS - lahat ng may empty sa baba babagsak
 let moved=true;
 while(moved){
   moved=false;
   for(let y=ROWS-2;y>=0;y--){
     for(let x=0;x<COLS;x++){
       if(board[y][x] &&!board[y+1][x]){
         board[y+1][x]=board[y][x];
         board[y][x]=0;
         moved=true;
       }
     }
   }
 }
}

function checkLines(){
 // pag puno row, clear
 for(let y=0;y<ROWS;y++){
   if(board[y].every(c=>c)){
     board[y]=Array(COLS).fill(0);
     score+=100; beep(800,0.2);
   }
 }
}

function genNextIfNeeded(){
 let tray=document.getElementById('tray');
 if(tray.children.length<=3){
   // tataas lang pag naglagay ka na (ito fix boss!)
   if(hasPlaced){
     riseOneRow();
     hasPlaced=false;
     // refill tray
     setTimeout(()=>{ genTray(); genNext(); document.getElementById('status').innerText='Tumaas! Bagong blocks!'; },400);
   }
 }
}

function riseOneRow(){
 // push up
 for(let y=0;y<ROWS-1;y++) board[y]=[...board[y+1]];
 // new bottom
 let newRow=Array(COLS).fill(0);
 for(let x=0;x<COLS;x++) if(Math.random()<0.25) newRow[x]=COLORS[Math.floor(Math.random()*COLORS.length)];
 board[ROWS-1]=newRow;
 // game over check
 if(board[0].some(c=>c)){ setTimeout(()=>{alert('GAME OVER! Score:'+score); newGame();},300); }
}

function updateUI(){ document.getElementById('score').innerText=score; document.getElementById('moves').innerText=moves; }

function toggleSound(){ soundOn=!soundOn; document.getElementById('soundBtn').innerText=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF'; initAudio(); if(soundOn) beep(440,0.1); }

document.addEventListener('click',()=>initAudio(),{once:true});
newGame();
</script>
</body>
</html>
