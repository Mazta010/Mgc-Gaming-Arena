<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Block Blast 1-2-3-4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;touch-action:manipulation;user-select:none}
body{background:#1e3a8a;min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#fff}
.top{width:100%;background:#0f172a;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:900;font-size:13px;border-bottom:2px solid #22d3ee;position:sticky;top:0;z-index:99}
.top a{background:#020617;border:2px solid #22d3ee;color:#22d3ee;padding:6px 16px;border-radius:20px;text-decoration:none}
.score{font-size:60px;font-weight:900;margin:8px 0 0;line-height:1}
.sub{color:#facc15;font-weight:800;font-size:11px}
#board{width:92vw;max-width:380px;aspect-ratio:1;background:#0f172a;border-radius:16px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:5px;padding:10px;margin-top:10px;border:3px solid #1e293b}
.cell{background:#1e293b;border-radius:6px}
.cell.f{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 8px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2)}
#tray{width:94%;max-width:390px;background:#0f172a;border-radius:14px;padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;justify-content:center}
.b{height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#000;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 8px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);cursor:pointer}
.b.sel{outline:3px solid #22d3ee;box-shadow:0 0 18px #22d3ee;transform:scale(1.08)}
.b.w1{width:70px}.b.w2{width:110px}.b.w3{width:150px}.b.w4{width:190px}
#hint{font-size:11px;color:#22d3ee;font-weight:800;margin:8px;text-align:center}
</style>
</head>
<body>
<div class="top"><a href="index.html">← ARENA</a><span>🏆<span id="best">0</span></span><span>Moves:<b id="mv">0</b></span></div>
<div class="score" id="sc">0</div>
<div class="sub">1-2-3-4 BLOCKS | TAP BLOCK → TAP BOARD!</div>
<div id="board"></div>
<div id="hint">PILI KA BLOCK (1,2,3,4) SA BABA!</div>
<div id="tray"></div>
<div style="display:flex;gap:10px;margin:18px 0 30px"><button onclick="newGame()" style="padding:12px 22px;border-radius:12px;border:none;font-weight:900">🔄 NEW</button><a href="index.html" style="padding:12px 22px;border-radius:12px;background:#0f172a;border:2px solid #22d3ee;color:#22d3ee;text-decoration:none;font-weight:900">🏠 ARENA</a></div>

<script>
const C=8,R=8,COLORS=["#f472b6","#60a5fa","#34d399","#facc15","#fb923c","#a78bfa","#22d3ee","#f87171"];
let board,score,moves,best=+localStorage.getItem("bbBest")||0,sel=null,tray=[];

function newGame(){
 board=Array.from({length:R},()=>Array(C).fill(0));score=0;moves=0;sel=null;
 document.getElementById("best").innerText=best; genTray(); draw(); upd();
}
function genTray(){
 tray=[];
 let trayEl=document.getElementById("tray"); trayEl.innerHTML="";
 // 8 blocks total 1,2,3,4 random
 for(let i=0;i<8;i++){
   let w=[1,2,3,4][Math.floor(Math.random()*4)];
   let col=COLORS[Math.floor(Math.random()*COLORS.length)];
   tray.push({id:Math.random(),w,col});
 }
 drawTray();
}
function drawTray(){
 let el=document.getElementById("tray"); el.innerHTML="";
 // 3 rows: 3,3,2
 let rows=[tray.slice(0,3),tray.slice(3,6),tray.slice(6,8)];
 rows.forEach(r=>{
   let row=document.createElement("div"); row.className="row";
   r.forEach(d=>{
     let b=document.createElement("div"); b.className="b w"+d.w+(sel&&sel.id==d.id?" sel":""); b.style.background=d.col; b.innerText=d.w; b.onclick=()=>{sel=d; document.getElementById("hint").innerText="Block "+d.w+" pinili! Tap board kung saan hulog!"; drawTray();};
     row.appendChild(b);
   });
   el.appendChild(row);
 });
}
function draw(){
 let b=document.getElementById("board"); b.innerHTML="";
 for(let y=0;y<R;y++) for(let x=0;x<C;x++){
   let c=document.createElement("div"); c.className="cell"+(board[y][x]?" f":""); if(board[y][x]) c.style.background=board[y][x];
   c.onclick=()=>drop(x);
   b.appendChild(c);
 }
}
function drop(col){
 if(!sel){ document.getElementById("hint").innerText="PILI KA MUNA BLOCK 1-2-3-4 SA BABA!"; return; }
 if(col+sel.w>C) col=C-sel.w;
 // find lowest empty
 let target=-1;
 for(let y=R-1;y>=0;y--){ let ok=true; for(let i=0;i<sel.w;i++) if(board[y][col+i]) ok=false; if(ok){target=y; break;} }
 if(target==-1){ document.getElementById("hint").innerText="Puno na dyan!"; return; }
 for(let i=0;i<sel.w;i++) board[target][col+i]=sel.col;
 tray=tray.filter(t=>t.id!=sel.id); sel=null; moves++; score+=10;
 let clr=0;
 for(let y=0;y<R;y++) if(board[y].every(v=>v)){ board[y].fill(0); clr++; }
 if(clr){ score+=clr*100; document.getElementById("hint").innerText=clr+" LINES CLEAR! 🔥"; gravity(); }
 else document.getElementById("hint").innerText="Nice! Block "+sel?.w+" nahulog!";
 if(tray.length<3) genTray(); else drawTray();
 if(score>best){best=score; localStorage.setItem("bbBest",best);}
 draw(); upd();
}
function gravity(){
 for(let x=0;x<C;x++){
   let stack=[]; for(let y=0;y<R;y++) if(board[y][x]) stack.push(board[y][x]);
   for(let y=0;y<R;y++) board[y][x]=0;
   for(let i=0;i<stack.length;i++) board[R-stack.length+i][x]=stack[i];
 }
}
function upd(){ document.getElementById("sc").innerText=score; document.getElementById("mv").innerText=moves; document.getElementById("best").innerText=best; }
newGame();
</script>
</body>
</html>
