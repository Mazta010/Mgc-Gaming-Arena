<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MGC BAR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
body{background:#2a437c;color:#fff;font-family:Arial;text-align:center}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#1a2a5a;font-weight:900;font-size:13px}
#trophy{background:#16264a;padding:6px 12px;border-radius:20px;border:2px solid #ffeb3b;cursor:pointer}
#playerBox{flex:1;margin:0 6px;background:#0f1c3a;padding:5px;border-radius:20px;cursor:pointer;font-size:12px}
#gameScore{font-weight:900;color:#22d3ee;font-size:16px;background:#0f1c3a;padding:4px 10px;border-radius:10px;min-width:50px}
#grid{width:96%;max-width:360px;height:500px;margin:6px auto;background:#16264a;border:4px solid #0e1a33;border-radius:12px;position:relative;overflow:hidden}
.bar{position:absolute;height:42px;border-radius:8px;border:2px solid rgba(0,0,0,.3);transition:top.22s ease,left.1s;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.bar.drag{transition:none!important;z-index:99;transform:scale(1.1)}
.c1{background:linear-gradient(180deg,#7ee8fa,#0ebfd3)}.c2{background:linear-gradient(180deg,#8ea8ff,#4b62e0)}.c3{background:linear-gradient(180deg,#ffe07a,#d69e00)}.c4{background:linear-gradient(180deg,#6ee7b7,#059669)}.c5{background:linear-gradient(180deg,#f9a8d4,#db2777)}.c6{background:linear-gradient(180deg,#fdba74,#ea580c)}.c7{background:linear-gradient(180deg,#c4b5fd,#7c3aed)}
.full{box-shadow:0 0 22px #ffeb3b!important;border:3px solid #ffeb3b!important;animation:pulse.3s infinite}@keyframes pulse{50%{filter:brightness(1.5)}}
.boom{animation:boom.35s forwards}@keyframes boom{50%{transform:scale(1.4)}100%{transform:scale(0);opacity:0}}
#nextBox{width:96%;max-width:360px;margin:6px auto;background:#0f1c3a;border:2px dashed #ffeb3b;border-radius:10px;padding:6px;font-size:11px;color:#ffeb3b;font-weight:900}
#nextPreview{height:30px;position:relative;margin-top:4px;background:rgba(0,0,0,.4);border-radius:6px;border:1px solid rgba(255,235,59,.3)}
.mini{position:absolute;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:10px;border:1px solid rgba(0,0,0,.2)}
#controls{display:flex;justify-content:center;gap:7px;padding:8px 6px}
#controls button{background:#22d3ee;color:#000;border:none;padding:11px 14px;border-radius:22px;font-weight:900;cursor:pointer;font-size:12px}
#over,#lbModal,#profileModal,#pauseModal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.inner{background:#1e2f5a;padding:18px;border-radius:16px;width:95%;max-width:340px;border:3px solid #22d3ee;position:relative}
.closeX{position:absolute;top:8px;right:10px;background:#ff3b3b;color:#fff;border:none;width:28px;height:28px;border-radius:50%;font-weight:900;cursor:pointer;font-size:16px}
.lb-row{display:flex;justify-content:space-between;padding:6px 8px;background:#0f1c3a;margin:4px 0;border-radius:8px;font-size:12px}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;background:rgba(0,0,0,.9);padding:8px 18px;border-radius:20px;animation:popUp.8s forwards;z-index:100;color:#ffeb3b;border:2px solid #ffeb3b}
@keyframes popUp{0%{transform:translate(-50%,0) scale(0)}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
</style>
</head>
<body>
<div id="top">
<div id="trophy" onclick="showLB()">🏆 <span id="best">0</span></div>
<div id="playerBox" onclick="showProfile()">👤 <span id="pName">Mazta</span></div>
<div id="gameScore">0</div>
<div style="background:#334155;padding:6px 10px;border-radius:10px;cursor:pointer;margin-left:6px" onclick="togglePause()">⏸️</div>
</div>
<div id="grid"></div>
<div id="nextBox">NEXT LINE 👇 EXACT!
<div id="nextPreview"></div>
</div>
<div id="controls">
<button onclick="start()">🔄 NEW</button>
<button onclick="toggleSound()" id="sndBtn">🔊 ON</button>
<button onclick="togglePause()" id="pauseBtn">⏸️ PAUSE</button>
<button onclick="location.href='index.html'" style="background:#334155;color:#fff">⬅️ ARENA</button>
</div>
<div id="over"><div class="inner" style="text-align:center"><button class="closeX" onclick="closeAll()">X</button><h2 style="color:#ff3b3b">PUNO NA!</h2><p>Score: <b id="finalS">0</b> | Moves: <b id="finalM">0</b></p><button onclick="start()" style="width:100%;background:#22d3ee;padding:12px;border-radius:20px;border:none;font-weight:900;margin-top:10px">🔄 ULIT</button><button onclick="showLB()" style="width:100%;background:#0f1c3a;color:#ffeb3b;border:1px solid #ffeb3b;margin-top:8px;padding:10px;border-radius:20px">🏆 LEADERBOARD</button></div></div>
<div id="lbModal"><div class="inner"><button class="closeX" onclick="closeAll()">X</button><h2>🏆 TOP 100</h2><div id="lbList"></div><button onclick="closeAll()" style="width:100%;margin-top:10px;background:#334155;color:#fff;padding:10px;border-radius:12px;border:none">CLOSE</button></div></div>
<div id="profileModal"><div class="inner"><button class="closeX" onclick="closeAll()">X</button><h2>👤 Profile</h2><div id="profileList"></div><button onclick="closeAll()" style="width:100%;margin-top:10px;background:#334155;color:#fff;padding:10px;border-radius:12px;border:none">CLOSE</button></div></div>
<div id="pauseModal"><div class="inner" style="text-align:center"><button class="closeX" onclick="closeAll()">X</button><h2>⏸️ PAUSED</h2><p>Score: <b id="pauseScore">0</b></p><button onclick="togglePause()" style="width:100%;background:#22d3ee;padding:12px;border-radius:20px;border:none;font-weight:900;margin-top:10px">▶ RESUME</button></div></div>
<script>
let W=8,H=10,blocks=[],score=0,moves=0,lock=false,best=0,soundOn=true,isPaused=false,nextLine=[];
const cols=['c1','c2','c3','c4','c5','c6','c7'];
let player=localStorage.getItem('mgcName')||'Mazta';
let lb=JSON.parse(localStorage.getItem('mgcLB')||'[]');
if(lb.length&&typeof lb[0]==='number') lb=lb.map(s=>({name:player,score:s,moves:0,date:Date.now()}));
best=lb[0]?.score||0;
function showLB(){lb.sort((a,b)=>b.score-a.score);let h='';if(!lb.length)h='<p>No scores</p>';else lb.slice(0,100).forEach((e,i)=>{h+=`<div class="lb-row"><span>#${i+1} ${e.name}</span><span>${e.score}</span></div>`});document.getElementById('lbList').innerHTML=h;document.getElementById('lbModal').style.display='flex';}
function showProfile(){let my=lb.filter(e=>e.name===player).sort((a,b)=>b.score-a.score);let h='';if(!my.length)h='<p>No games</p>';else my.slice(0,30).forEach((e,i)=>{h+=`<div class="lb-row"><span>${e.score}pts</span><span>${e.moves}m</span></div>`});document.getElementById('profileList').innerHTML=h;document.getElementById('profileModal').style.display='flex';}
function closeAll(){document.getElementById('lbModal').style.display='none';document.getElementById('profileModal').style.display='none';document.getElementById('pauseModal').style.display='none';document.getElementById('over').style.display='none';if(isPaused){isPaused=false;lock=false;document.getElementById('pauseBtn').innerText='⏸️ PAUSE';}}
function togglePause(){if(document.getElementById('over').style.display==='flex')return;isPaused=!isPaused;if(isPaused){lock=true;document.getElementById('pauseScore').innerText=score;document.getElementById('pauseModal').style.display='flex';document.getElementById('pauseBtn').innerText='▶ RESUME';}else{closeAll();document.getElementById('pauseBtn').innerText='⏸️ PAUSE';lock=false;}}
function toggleSound(){soundOn=!soundOn;document.getElementById('sndBtn').innerText=soundOn?'🔊 ON':'🔇 OFF';}
function newRowData(){let arr=[],x=0;while(x<W){if(Math.random()<0.9){let len=Math.floor(Math.random()*4)+1;len=Math.min(len,W-x);if(len>=1)arr.push({x,len,c:cols[Math.floor(Math.random()*cols.length)]});x+=len;if(Math.random()<0.2)x++;}else x++;}if(arr.length==0)arr.push({x:0,len:2,c:cols[0]});return arr;}
function previewNext(){let p=document.getElementById('nextPreview');p.innerHTML='';let cw=p.clientWidth/W;nextLine.forEach(b=>{let d=document.createElement('div');d.className='mini '+b.c;d.style.left=(b.x*cw+2)+'px';d.style.width=(b.len*cw-5)+'px';d.innerText=b.len;p.appendChild(d);});}
function start(){blocks=[];score=0;moves=0;lock=false;isPaused=false;closeAll();document.getElementById('pauseBtn').innerText='⏸️ PAUSE';for(let y=H-3;y<H;y++){let row=newRowData();row.forEach(r=>{blocks.push({x:r.x,y,len:r.len,c:r.c,id:Math.random().toString(36).slice(2)});});}nextLine=newRowData();previewNext();gravity();autoClearImmediate();render();}
function isColliding(b,ty){return blocks.some(o=>o.id!=b.id&&o.y==ty&&!(b.x+b.len<=o.x||b.x>=o.x+o.len));}
function getDrop(b){let ny=b.y;for(let y=b.y+1;y<H;y++){if(isColliding(b,y))break;ny=y;}return ny;}
function gravity(){let m=true,l=0;while(m&&l<50){m=false;l++;let s=[...blocks].sort((a,b)=>b.y-a.y);for(let b of s){let d=getDrop(b);if(d!=b.y){b.y=d;m=true;}}}}
function getFull(){let f=[];for(let y=0;y<H;y++){let row=blocks.filter(b=>b.y==y);if(!row.length)continue;let cov=Array(W).fill(0);row.forEach(o=>{for(let i=0;i<o.len;i++)if(o.x+i<W)cov[o.x+i]=1;});if(cov.every(v=>v))f.push(y);}return f;}
function autoClearImmediate(){let full=getFull();if(full.length){blocks=blocks.filter(b=>!full.includes(b.y));score+=full.length*30;if(score>best)best=score;gravity();return full.length;}return 0;}
function render(){let g=document.getElementById('grid');g.innerHTML='';let cw=g.clientWidth/W;let fullSet=new Set(getFull());blocks.forEach(b=>{if(b.y<0||b.y>=H)return;let d=document.createElement('div');d.className='bar '+b.c+(fullSet.has(b.y)?' full':'');d.dataset.id=b.id;d.style.left=(b.x*cw+2)+'px';d.style.top=(b.y*48+2)+'px';d.style.width=(b.len*cw-6)+'px';d.addEventListener('touchstart',s,{passive:false});d.addEventListener('mousedown',s);g.appendChild(d);});document.getElementById('gameScore').innerText=score;document.getElementById('best').innerText=best;document.getElementById('pName').innerText=player;}
let drag=null;
function s(e){if(lock||isPaused)return;e.preventDefault();let b=blocks.find(o=>o.id==e.currentTarget.dataset.id);if(!b)return;let t=e.touches?e.touches[0]:e;drag={b,el:e.currentTarget,sx:t.clientX,startLeft:b.x*360/8,_last:null,origX:b.x,origY:b.y};e.currentTarget.classList.add('drag');window.addEventListener('touchmove',m,{passive:false});window.addEventListener('mousemove',m);window.addEventListener('touchend',eD);window.addEventListener('mouseup',eD);}
function m(e){if(!drag)return;e.preventDefault();let t=e.touches?e.touches[0]:e;let dx=t.clientX-drag.sx;let cw=360/8;let nl=drag.startLeft+dx;nl=Math.max(0,Math.min((W-drag.b.len)*cw,nl));let px=Math.round(nl/cw);let others=blocks.filter(o=>o.y==drag.b.y&&o.id!=drag.b.id);for(let o of others){if(!(px+drag.b.len<=o.x||px>=o.x+o.len)){if(dx>0)nl=(o.x-drag.b.len)*cw-2;else nl=(o.x+o.len)*cw+2;break;}}drag.el.style.left=nl+'px';drag._last=nl;}
function eD(e){
  if(!drag)return;
  let cw=360/8;
  let fl=drag._last!==null?drag._last:drag.startLeft;
  let nx=Math.round(fl/cw);nx=Math.max(0,Math.min(W-drag.b.len,nx));
  let others=blocks.filter(o=>o.y==drag.b.y&&o.id!=drag.b.id);
  let can=!others.some(o=>!(nx+drag.b.len<=o.x||nx>=o.x+o.len));
  if(can)drag.b.x=nx;
  let origB=drag.b;
  drag=null;
  window.removeEventListener('touchmove',m);window.removeEventListener('mousemove',m);window.removeEventListener('touchend',eD);window.removeEventListener('mouseup',eD);
  let drop=getDrop(origB);
  let fell = drop!==origB.y;
  origB.y=drop;
  gravity();
  moves++;
  render();
  let fullBefore=getFull();
  if(fullBefore.length){
    lock=true;
    document.querySelectorAll('.bar').forEach(el=>{let b=blocks.find(o=>o.id==el.dataset.id);if(b&&fullBefore.includes(b.y))el.classList.add('boom');});
    setTimeout(()=>{
      blocks=blocks.filter(b=>!fullBefore.includes(b.y));
      let add=fullBefore.length*40;
      score+=add;
      if(score>best)best=score;
      lb.push({name:player,score,moves,date:Date.now()});lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,100);localStorage.setItem('mgcLB',JSON.stringify(lb));
      let pop=document.createElement('div');pop.className='pop';pop.innerText='+'+add+' BLAST!';document.body.appendChild(pop);setTimeout(()=>pop.remove(),800);
      gravity();
      render();
      lock=false;
      doRise();
    },250);
  }else{
    setTimeout(doRise, fell?180:60);
  }
}
function doRise(){
  if(blocks.some(b=>b.y<=0)){document.getElementById('finalS').innerText=score;document.getElementById('finalM').innerText=moves;document.getElementById('over').style.display='flex';return;}
  blocks.forEach(b=>b.y--);
  nextLine.forEach(r=>{
    blocks.push({x:r.x,y:H-1,len:r.len,c:r.c,id:Math.random().toString(36).slice(2)});
  });
  nextLine=newRowData();
  previewNext();
  let fullAfter=getFull();
  if(fullAfter.length){
    blocks=blocks.filter(b=>!fullAfter.includes(b.y));
    let add=fullAfter.length*40;
    score+=add;
    if(score>best)best=score;
    lb.push({name:player,score,moves,date:Date.now()});lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,100);localStorage.setItem('mgcLB',JSON.stringify(lb));
    let pop=document.createElement('div');pop.className='pop';pop.innerText='+'+add+' AUTO!';document.body.appendChild(pop);setTimeout(()=>pop.remove(),800);
    gravity();
  }
  render();
  if(blocks.some(b=>b.y<0)){document.getElementById('finalS').innerText=score;document.getElementById('finalM').innerText=moves;document.getElementById('over').style.display='flex';}
}
start();
</script>
</body>
</html>
