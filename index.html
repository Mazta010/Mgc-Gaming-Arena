<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGC Gaming Arena - Mazta Gaming</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#fff;font-family:system-ui,sans-serif;padding-bottom:70px}
.header{background:linear-gradient(90deg,#06b6d4,#3b82f6);padding:20px;text-align:center}
.header h1{font-size:28px;font-weight:900;letter-spacing:1px}
.header p{opacity:0.9;font-size:14px;margin-top:4px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:20px;max-width:900px;margin:0 auto}
.game-card{background:#1e293b;border-radius:16px;padding:12px;text-decoration:none;color:#fff;border:2px solid #334155;transition:0.2s;display:block}
.game-card.live{border-color:#22d3ee;box-shadow:0 0 15px rgba(34,211,238,0.3)}
.game-card:hover{transform:translateY(-4px);border-color:#22d3ee}
.game-card img{width:100%;height:120px;object-fit:cover;border-radius:12px;background:#0f172a}
.game-card h3{margin:10px 0 4px;font-size:15px}
.game-card .badge{background:#22d3ee;color:#000;font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px;display:inline-block}
.game-card.coming{opacity:0.5}

/* BANNER */
.mgc-banner{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:2px solid #22d3ee;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;z-index:9999}
.mgc-banner .left{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer}
.mgc-banner .ad-text{font-size:13px}
.mgc-banner .ad-text span{color:#22d3ee;font-weight:bold}
.mgc-banner .ad-btn{background:#22d3ee;color:#000;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:900;border:none;cursor:pointer}
.mgc-banner .close-ad{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;margin-left:10px;opacity:0.6}
</style>
</head>
<body>

<div class="header">
  <h1>🎮 MGC GAMING ARENA</h1>
  <p>By Mazta010 - Free To Play</p>
</div>

<div class="games">
  <a href="block-blast.html" class="game-card live">
    <img src="https://placehold.co/300x200/06b6d4/000?text=BLOCK+BLAST" alt="Block Blast">
    <h3>Block Blast</h3>
    <span class="badge">▶ PLAY NOW</span>
  </a>
  <a href="tetris-battle.html" class="game-card live">
    <img src="https://placehold.co/300x200/8b5cf6/fff?text=TETRIS" alt="Tetris">
    <h3>Tetris Battle</h3>
    <span class="badge">▶ PLAY NOW</span>
  </a>
  <div class="game-card coming">
    <img src="https://placehold.co/300x200/334155/fff?text=COMING+SOON" alt="Coming">
    <h3>Candy Crush</h3>
    <span class="badge" style="background:#334155;color:#fff">SOON</span>
  </div>
  <div class="game-card coming">
    <img src="https://placehold.co/300x200/334155/fff?text=COMING+SOON" alt="Coming">
    <h3>2048</h3>
    <span class="badge" style="background:#334155;color:#fff">SOON</span>
  </div>
</div>

<!-- BOTTOM BANNER -->
<div class="mgc-banner" id="mgcBanner">
  <div class="left" onclick="openAd()">
    <div style="font-size:22px">🔥</div>
    <div class="ad-text"><span>Support Free Games!</span> Click to support MGC 🎮</div>
  </div>
  <button class="ad-btn" onclick="openAd()">SUPPORT</button>
  <button class="close-ad" onclick="closeBanner()">✕</button>
</div>

<script>
const DIRECT_LINK = "https://omg10.com/4/11879270";

function openAd() {
  window.open(DIRECT_LINK, '_blank');
}

function closeBanner() {
  document.getElementById('mgcBanner').style.display = 'none';
  setTimeout(()=>{ document.getElementById('mgcBanner').style.display='flex'; }, 180000);
}

function handleGameClick(e, url) {
  e.preventDefault();
  // Open ad sa new tab - KITA KA NA
  window.open(DIRECT_LINK, '_blank');
  // Tapos after 400ms punta sa game
  setTimeout(()=>{ window.location.href = url; }, 400);
}

// Lagay click event sa lahat ng live games
document.querySelectorAll('.game-card.live').forEach(card=>{
  const href = card.getAttribute('href');
  if(href){
    card.addEventListener('click', (e)=>handleGameClick(e, href));
  }
});
</script>

</body>
</html>
